<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>ECONOMATO · Pedidos</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e7ebf2;--accent:#5b5ce2;--accent2:#7c3aed;--green:#16a34a;--shadow:0 10px 30px rgba(20,30,55,.08)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#eef2ff 0,#f7f9fc 38%,#f4f7fb 100%);color:var(--text)}
button,input{font:inherit} button{border:0;cursor:pointer}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:96px}
header{padding:24px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 10px 22px #5b5ce233}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:19px}
.search{margin:10px 18px 18px;position:relative}.search input{width:100%;padding:15px 16px 15px 46px;border:1px solid var(--line);border-radius:16px;background:#fff;outline:none;box-shadow:var(--shadow)}.search span{position:absolute;left:17px;top:13px;font-size:20px}
.section{padding:0 18px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.sectiontitle h2{font-size:15px;margin:0}.sectiontitle small{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.provider{background:#fff;border:1px solid var(--line);border-radius:19px;padding:16px;min-height:130px;text-align:left;box-shadow:var(--shadow);transition:.15s}.provider:active{transform:scale(.98)}.provider .badge{width:42px;height:42px;border-radius:13px;background:#eef0ff;color:var(--accent);display:grid;place-items:center;font-weight:900;margin-bottom:13px}.provider strong{display:block;font-size:16px}.provider small{display:block;color:var(--muted);margin-top:5px}
.back{display:flex;align-items:center;gap:8px;margin:8px 18px 14px}.back button{background:transparent;color:var(--accent);font-weight:800}.hero{margin:0 18px 16px;background:linear-gradient(135deg,#171d36,#323a72);color:#fff;border-radius:22px;padding:20px;box-shadow:0 14px 35px #20264b2e}.hero h2{margin:0 0 5px;font-size:22px}.hero p{margin:0;color:#cfd5ff;font-size:13px}.product{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 12px;margin-bottom:9px;box-shadow:0 6px 20px rgba(20,30,55,.05)}.productname{font-weight:700;font-size:14px;line-height:1.25}.qty{display:flex;align-items:center;gap:8px;flex-shrink:0}.qty button{width:35px;height:35px;border-radius:11px;background:#eef0ff;color:var(--accent);font-size:20px;font-weight:800}.qty .num{min-width:25px;text-align:center;font-weight:800}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#ffffffeb;backdrop-filter:blur(12px);border-top:1px solid var(--line)}.cartbtn{width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900;display:flex;justify-content:space-between;box-shadow:0 12px 24px #5b5ce233}
.modal{position:fixed;inset:0;background:#0b1020aa;display:none;align-items:flex-end;justify-content:center;z-index:5}.modal.show{display:flex}.sheet{background:#fff;width:min(620px,100%);border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{margin:0 0 4px}.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:18px}.summary{border:1px solid var(--line);border-radius:17px;padding:8px 14px;margin-bottom:15px}.sumrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:15px}.sumrow:last-child{border-bottom:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{padding:15px;border-radius:15px;font-weight:900}.wa{background:#dcfce7;color:#15803d}.mail{background:#eef2ff;color:#4338ca}.secondary{background:#f1f5f9;color:#334155;margin-top:10px;width:100%;padding:14px;border-radius:15px;font-weight:800}.history{margin-top:18px}.order{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px}.orderhead{display:flex;justify-content:space-between;gap:8px}.order small{color:var(--muted)}.repeat{margin-top:10px;padding:9px 12px;border-radius:10px;background:#eef0ff;color:var(--accent);font-weight:800}
.empty{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:380px){.grid{grid-template-columns:1fr}.productname{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">E</div><div><h1>ECONOMATO</h1><p>Gestión de pedidos</p></div></div>
  <button class="iconbtn" onclick="showHistory()">📋</button>
</header>
<div id="content"></div>
</div>

<div class="bottom" id="bottom" style="display:none"><button class="cartbtn" onclick="openSummary()"><span>🛒 Ver pedido</span><span id="cartCount">0 uds.</span></button></div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const providers=[
 {id:1,name:"Coca Cola",channel:"whatsapp",contact:"627012815",products:["Coca Cola","Coca Cola zero","Fanta naranja","Fanta limon","Seven up","Aquarios naranja","Aquarius limon"]},
 {id:2,name:"Garrido",channel:"email",contact:"novoanana@gmail.com",products:["Tomillo","Romero","Canela","Cebolla crispy","Maiz","Aun","Piña lata","Pera lata","Melocotón lata"]},
 {id:3,name:"Disbesa",channel:"whatsapp",contact:"630100097",products:["Sopa ave y fideos","Sopa rabo de buey","Sopa minestrone","Sopa cebolla","Sopa marisco"]},
 {id:4,name:"Codillo",channel:"email",contact:"martinaynana@gmail.com",products:["Larios","j&b","Malibu","Granadina","Limonchelo","Tequila","Martini rojo","Martini blanco"]}
].map(p=>({...p,products:[...p.products].sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}))}));

let current=null, cart={};
const $=id=>document.getElementById(id);
function renderHome(filter=""){
 const list=providers.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()));
 $('content').innerHTML=`<div class="search"><span>⌕</span><input id="providerSearch" placeholder="Buscar proveedor..." value="${esc(filter)}" oninput="renderHome(this.value)"></div>
 <div class="section"><div class="sectiontitle"><h2>Proveedores</h2><small>${list.length} disponibles</small></div>
 <div class="grid">${list.map(p=>`<button class="provider" onclick="openProvider(${p.id})"><div class="badge">${p.name[0].toUpperCase()}</div><strong>${esc(p.name)}</strong><small>${p.products.length} artículos · ${p.channel==="whatsapp"?"WhatsApp":"Email"}</small></button>`).join("")||'<div class="empty">No se encontró ningún proveedor.</div>'}</div></div>`;
 $('bottom').style.display="none";
}
function openProviderWithCart(id){ openProvider(id); Object.keys(cart).forEach(n=>{const el=$('q-'+slug(n));if(el)el.textContent=cart[n]}); updateCart(); openSummary(); }
function openProvider(id,filter=""){
 current=providers.find(p=>p.id===id); cart={};
 const list=current.products.filter(x=>x.toLowerCase().includes(filter.toLowerCase()));
 $('content').innerHTML=`<div class="back"><button onclick="renderHome()">← Proveedores</button></div>
 <div class="hero"><h2>${esc(current.name)}</h2><p>${current.products.length} artículos · Pedido por ${current.channel==="whatsapp"?"WhatsApp":"email"}</p></div>
 <div class="search"><span>⌕</span><input id="productSearch" placeholder="Buscar artículo..." value="${esc(filter)}" oninput="openProvider(${id},this.value)"></div>
 <div class="section">${list.map((x,i)=>`<div class="product"><div class="productname">${esc(x)}</div><div class="qty"><button onclick="changeQtyByIndex(${i},-1)">−</button><div class="num" id="q-${slug(x)}">0</div><button onclick="changeQtyByIndex(${i},1)">+</button></div></div>`).join("")||'<div class="empty">No se encontró ningún artículo.</div>'}</div>`;
 $('bottom').style.display="block"; updateCart();
}
function changeQtyByIndex(i,delta){changeQty(current.products.filter(x=>x.toLowerCase().includes((document.getElementById("productSearch")?.value||"").toLowerCase()))[i],delta)}
function changeQty(name,delta){cart[name]=Math.max(0,(cart[name]||0)+delta); if(!cart[name]) delete cart[name]; const el=$('q-'+slug(name)); if(el) el.textContent=cart[name]||0; updateCart()}
function updateCart(){const n=Object.values(cart).reduce((a,b)=>a+b,0);$('cartCount').textContent=n+" uds."}
function openSummary(){
 if(!current||!Object.keys(cart).length){toast("Añade al menos un artículo");return}
 $('sheet').innerHTML=`<h2>Resumen del pedido</h2><div class="sub">${esc(current.name)} · ${new Date().toLocaleDateString('es-ES')}</div>
 <div class="summary">${Object.entries(cart).sort((a,b)=>a[0].localeCompare(b[0],'es',{sensitivity:'base'})).map(([n,q])=>`<div class="sumrow"><span>${esc(n)}</span><strong>${q}</strong></div>`).join("")}</div>
 <div class="actions"><button class="action wa" onclick="sendOrder()">📱 WhatsApp</button><button class="action mail" onclick="sendOrder()">✉️ Email</button></div>
 <button class="secondary" onclick="closeModal()">Seguir modificando</button>`;
 $('modal').classList.add('show');
}
function sendOrder(){
 const lines=Object.entries(cart).sort((a,b)=>a[0].localeCompare(b[0],'es',{sensitivity:'base'})).map(([n,q])=>`${n} — ${q}`).join("\n");
 const text=`Hola, os paso el pedido:\n\n${lines}\n\nGracias.`;
 const record={id:Date.now(),date:new Date().toLocaleString('es-ES'),provider:current.name,items:{...cart},channel:current.channel};
 const history=JSON.parse(localStorage.getItem('economato_orders')||"[]"); history.unshift(record); localStorage.setItem('economato_orders',JSON.stringify(history.slice(0,100)));
 if(current.channel==="whatsapp"){const phone="34"+current.contact.replace(/\D/g,"").replace(/^34/,""); window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(text), "_blank")}
 else {window.location.href="mailto:"+current.contact+"?subject="+encodeURIComponent("Pedido "+current.name)+"&body="+encodeURIComponent(text)}
 toast("Pedido preparado y guardado en historial");
 closeModal();
}
function showHistory(){
 const h=JSON.parse(localStorage.getItem('economato_orders')||"[]");
 $('sheet').innerHTML=`<h2>Historial de pedidos</h2><div class="sub">Los pedidos quedan guardados en este dispositivo.</div><div class="history">${h.length?h.map(o=>`<div class="order"><div class="orderhead"><strong>${esc(o.provider)}</strong><small>${esc(o.date)}</small></div><small>${Object.values(o.items).reduce((a,b)=>a+b,0)} unidades · ${o.channel==="whatsapp"?"WhatsApp":"Email"}</small><button class="repeat" onclick="repeatOrder(${o.id})">↻ Repetir pedido</button></div>`).join(""):'<div class="empty">Todavía no hay pedidos.</div>'}</div><button class="secondary" onclick="closeModal()">Cerrar</button>`;
 $('modal').classList.add('show');
}
function repeatOrder(id){
 const h=JSON.parse(localStorage.getItem('economato_orders')||"[]"),o=h.find(x=>x.id===id); if(!o)return;
 current=providers.find(p=>p.name===o.provider); cart={...o.items}; closeModal(); openProviderWithCart(current.id);
 Object.keys(cart).forEach(n=>{const el=$('q-'+slug(n));if(el)el.textContent=cart[n]});updateCart();openSummary();
}
function closeModal(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==="modal")closeModal()});
function slug(s){return btoa(unescape(encodeURIComponent(s))).replace(/[^a-zA-Z0-9]/g,"").slice(0,30)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
renderHome();
</script>
</body>
</html>
