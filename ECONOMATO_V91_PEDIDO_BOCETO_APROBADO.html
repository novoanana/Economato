/* V30 — ICONOS DE BÚSQUEDA LIMPIOS, IGUALES AL LENGUAJE VISUAL SUPERIOR */

.searchToolsV29{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin:10px 0 18px;
  width:100%;
}

.searchToggleV29{
  width:48px;
  height:48px;
  min-width:48px;
  padding:0;
  border:0;
  background:transparent;
  border-radius:50%;
  color:#20233f;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:transform .18s ease, color .18s ease, filter .18s ease;
  box-shadow:none;
}

.searchToggleV29:hover{
  transform:translateY(-2px) scale(1.04);
  color:#4f4bd4;
}

.searchToggleV29:active{
  transform:scale(.92);
}

.searchToggleV29.active{
  color:#5b58d2;
  background:transparent;
  box-shadow:none;
}

.searchToggleV29::after{
  content:attr(aria-label);
  position:absolute;
  top:calc(100% + 7px);
  left:50%;
  transform:translate(-50%,-3px);
  background:#252946;
  color:#fff;
  padding:5px 8px;
  border-radius:7px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease,transform .15s ease;
  z-index:30;
}

.searchToggleV29:hover::after{
  opacity:1;
  transform:translate(-50%,0);
}

.modernSearchIconV29{
  width:30px;
  height:30px;
  display:block;
}

.modernCanIconV29{
  width:30px;
  height:30px;
  display:block;
  filter:drop-shadow(0 1px 1px rgba(40,44,80,.12));
}

.searchModalV29{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:78px 18px 24px;
  background:rgba(20,24,45,.42);
  backdrop-filter:blur(7px);
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}

.searchModalV29.open{
  opacity:1;
  pointer-events:auto;
}

.searchModalCardV29{
  width:min(560px,100%);
  background:#fff;
  border-radius:24px;
  box-shadow:0 24px 70px rgba(20,24,45,.24);
  padding:18px;
  transform:translateY(-12px) scale(.98);
  transition:transform .25s ease;
}

.searchModalV29.open .searchModalCardV29{
  transform:translateY(0) scale(1);
}

.searchModalHeadV29{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.searchModalTitleV29{
  font-size:18px;
  font-weight:900;
  color:#20233f;
  display:flex;
  align-items:center;
  gap:8px;
}

.searchModalCloseV29{
  width:36px;
  height:36px;
  border:0;
  border-radius:12px;
  background:#f2f3f8;
  color:#555b76;
  font-size:22px;
  cursor:pointer;
  transition:transform .18s ease,background .18s ease;
}

.searchModalCloseV29:hover{
  transform:scale(1.05);
  background:#e9eaf2;
}

.searchModalCardV29 .search{margin:0;}
.searchModalCardV29 .search input{font-size:16px;}

.searchResultsV29{
  margin-top:12px;
  display:grid;
  gap:8px;
  max-height:390px;
  overflow:auto;
}

.providerSearchResultV29,
.articleSearchResultV29{
  width:100%;
  border:1px solid #e8e9f2;
  background:#fff;
  border-radius:15px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
  cursor:pointer;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}

.providerSearchResultV29:hover,
.articleSearchResultV29:hover{
  transform:translateY(-1px);
  border-color:#d9daf0;
  box-shadow:0 7px 18px rgba(40,44,80,.08);
}

.providerSearchResultMainV29 strong,
.articleSearchResultMainV29 strong{
  display:block;
  font-size:14px;
  color:#20233f;
}

.providerSearchResultMainV29 small,
.articleSearchResultMainV29 small{
  display:block;
  margin-top:3px;
  color:#7b7f96;
  font-size:12px;
}

.searchResultArrowV29{
  font-size:24px;
  color:#5b58d2;
  line-height:1;
}

@media (max-width:520px){
  .searchToggleV29{
    width:50px;
    height:50px;
    flex-basis:50px;
    border-radius:15px;
  }
}

async function apiGet(action){
  const r=await fetch(API_URL+"?accion="+encodeURIComponent(action)+"&t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("Error HTTP "+r.status);
  const d=await r.json();
  if(!d.ok) throw new Error(d.error||"Error en API");
  return d.datos||[];
}

  const d=await r.json();
  if(!d.ok) throw new Error(d.error||"Error en API");

function first(o,keys){for(const k of keys){if(o && o[k]!==undefined && o[k]!==null && String(o[k]).trim()!=="") return o[k]}return ""}
function normalizarTextoBusquedaSeguro(valor){
  return String(valor||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}
function normProvider(p){
  const whatsappField=String(first(p,["WHATSAPP","whatsapp"])).trim();
  const emailField=String(first(p,["EMAIL","email"])).trim();
  const legacyContact=String(first(p,["CONTACTO","contacto"])).trim();
  const canal=String(first(p,["CANAL","canal"])).toLowerCase();

  // Compatibilidad total con proveedores antiguos:
  // - Si WHATSAPP/EMAIL ya existen, tienen prioridad.
  // - Si están vacíos, recuperamos el dato de CONTACTO.
  // - Si CONTACTO contiene @, lo tratamos como email.
  // - Si es un teléfono, lo tratamos como WhatsApp.
  let whatsapp=whatsappField;
  let email=emailField;

  if(!whatsapp && !email && legacyContact){
    if(legacyContact.includes("@")){
      email=legacyContact;
    }else{
      whatsapp=legacyContact;
    }
  }else{
    if(!whatsapp && (canal==="whatsapp" || canal==="ambos") && legacyContact && !legacyContact.includes("@")){
      whatsapp=legacyContact;
    }
    if(!email && (canal==="email" || canal==="ambos") && legacyContact && legacyContact.includes("@")){
      email=legacyContact;
    }
  }

  const name=String(first(p,["NOMBRE","nombre"]));
  const image=String(first(p,["IMAGEN_URL","IMAGEN","LOGO_URL","LOGO","imagen_url","imagen","logo_url","logo"])).trim();
  return {
    id:first(p,["ID","id"]),
    name,
    searchName:normalizarTextoBusquedaSeguro(name),
    whatsapp,
    email,
    emailCopia:String(first(p,["EMAIL_COPIA","email_copia"])),
    image,
    active:String(first(p,["ACTIVO","activo"])).toLowerCase()!=="false"
  };
}
function makeAutoArticleId(index,article){
  const raw=[article.providerId||"SIN-PROV",article.name||"SIN-NOMBRE",article.codigo||"",index].join("|");
  let h=0;
  for(let i=0;i<raw.length;i++) h=((h<<5)-h)+raw.charCodeAt(i)|0;
  return "AUTO-ART-"+Math.abs(h).toString(36).toUpperCase()+"-"+index;
}

  const providerId=first(a,["PROVEEDOR_ID","proveedor_id"]);

function asignarClavesArticulos(lista){
  const usados=new Set();
  return lista.map((a,index)=>{
    const original=String(a.id||"").trim();
    let clave=original;
    let auto=false;
    if(!clave || usados.has(clave)){
      clave=makeAutoArticleId(index,a);
      auto=true;
      let n=1;
      while(usados.has(clave)) clave=makeAutoArticleId(index,a)+"-"+(n++);
    }
    usados.add(clave);
    return {...a,cartId:clave,idOriginal:original,autoId:auto};
  });
}

async function entrarTemporal(usuario){
  document.body.classList.remove("loginModeV60");
  const u=TEMP_USERS[usuario];
  if(!u){toast("Usuario no válido");return}
  try{
    $("status").textContent="● Comprobando hotel…";
    $("status").className="status";
    const r=await apiPost({accion:"obtener_contexto_hotel",hotelId:u.hotelId});
    if(!r.ok) throw new Error(r.error||"Hotel no disponible");
    session={...u,token:"",usuarioId:usuario==="novoa"?"USR-001":"USR-002"};
    guardarSesionLocal();
    actualizarCabecera();
    await cargarDatos({fast:true});
    await v44CargarPedidosRealizadosHoy();
    renderHome();
    toast("Acceso correcto · "+session.hotelNombre);
  }catch(e){setError(e)}
}
function cerrarSesionApp(){
  try{
    if(typeof window.borrarBorradorPedidoV20==="function"){
      window.borrarBorradorPedidoV20();
    }
  }catch(e){}
  window.pedidoOrigenActualV21="";
  limpiarSesionLocal();
  providers=[]; articles=[]; articlesByProvider=new Map(); providersById=new Map(); current=null; cart={};
  actualizarCabecera();
  renderLogin();
  $("status").textContent="● Sesión cerrada";
  $("status").className="status";
}
const DATA_CACHE_TTL=90000;
const DATA_CACHE_PREFIX="ECONOMATO_DATA_CACHE_V25_";
function dataCacheKey(){return DATA_CACHE_PREFIX+String(session?.hotelId||"");}
function readDataCache(){
  try{
    const raw=sessionStorage.getItem(dataCacheKey());
    if(!raw) return null;
    const d=JSON.parse(raw);
    if(!d||!d.savedAt||Date.now()-d.savedAt>DATA_CACHE_TTL) return null;
    return d;
  }catch(e){return null}
}
function writeDataCache(proveedores,articulos){
  try{sessionStorage.setItem(dataCacheKey(),JSON.stringify({savedAt:Date.now(),proveedores,articulos}))}catch(e){}
}
function aplicarDatosEnMemoria(p,a){
  providers=p.map(normProvider).filter(x=>x.active).sort((a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"}));
  providersById=new Map(providers.map(p=>[String(p.id),p]));
  articles=asignarClavesArticulos(a.map((x,i)=>normArticle(x,i)).filter(x=>x.active));
  articles.sort((a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"}));
  articlesByProvider=new Map();
  for(const articulo of articles){const key=String(articulo.providerId);if(!articlesByProvider.has(key)) articlesByProvider.set(key,[]);articlesByProvider.get(key).push(articulo);}
}

function normalizarDiaCalendario(valor){
  return String(valor||"").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function fechaLocalSinHora(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function diaHoyCalendario(){const n=fechaLocalSinHora().getDay();return n===0?7:n;}
function formatoFechaHoyCalendario(){return fechaLocalSinHora().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});}
function cargarCalendarioEnMemoria(lista){
  providerCalendar=Array.isArray(lista)?lista.map(x=>({
    hotelId:String(x.hotelId||x.HOTEL_ID||""),
    providerId:String(x.proveedorId||x.PROVEEDOR_ID||""),
    diaPedido:String(x.diaPedido||x.DIA_PEDIDO||""),
    diaEntrega:String(x.diaEntrega||x.DIA_ENTREGA||""),
    activo:String(x.activo??x.ACTIVO??true).toLowerCase()!=="false"

  if(!session.hotelId){cargarCalendarioEnMemoria([]);return;}

function getProviderCalendarInfo(providerId){
  const rows=calendarByProvider.get(String(providerId))||[];
  if(!rows.length)return {today:false,delivery:"",nextDay:"",nextDelivery:"",hasCalendar:false};
  const today=diaHoyCalendario(),candidates=[],todayRows=[];
  for(const row of rows){
    const pedido={LUNES:1,MARTES:2,"MIERCOLES":3,JUEVES:4,VIERNES:5,SABADO:6,DOMINGO:7}[normalizarDiaCalendario(row.diaPedido)]||0;
    if(!pedido)continue;
    const delta=(pedido-today+7)%7;
    if(delta===0)todayRows.push(row);
    candidates.push({row,delta:delta===0?7:delta});
  }
  const next=candidates.sort((a,b)=>a.delta-b.delta)[0];
  return {today:todayRows.length>0,delivery:todayRows.length?String(todayRows[0].diaEntrega||"").trim():"",nextDay:next?String(next.row.diaPedido||"").trim():"",nextDelivery:next?String(next.row.diaEntrega||"").trim():"",hasCalendar:true};
}

/* ============================================================
   V44 — FUENTE DE VERDAD DEL ESTADO "PEDIDO REALIZADO"
   - El estado ya NO se guarda en localStorage.
   - Google Sheets / historial centralizado es la única fuente de verdad.
   - Solo se marca un proveedor si existe un pedido ENVIADO de HOY
     para el hotel + usuario de la sesión actual.
   - Si se elimina el pedido de Sheets, el ✓ desaparece al recargar.
   ============================================================ */
let v44SentTodayProviders = new Set();
let v44SentTodayLoaded = false;

function v44FechaLocalKey(valor){
  const d=valor instanceof Date?valor:new Date(valor);
  if(Number.isNaN(d.getTime()))return "";
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function v44HoyKey(){
  return v44FechaLocalKey(new Date());
}

function v42WasSentToday(providerId){
  return v44SentTodayProviders.has(String(providerId));
}

/*
 * Mantiene el nombre V42 para no romper ninguna llamada existente,
 * pero ya no escribe absolutamente nada en localStorage.
 */
function v42MarkSentToday(providerId,channel){
  v44SentTodayProviders.add(String(providerId));
}

function v42SentBadgeForProvider(providerId){
  if(!v42WasSentToday(providerId))return "";
  return `<div class="sentBadgeV42">✅ PEDIDO REALIZADO</div>`;
}

/*
 * Lee el historial real de Google Sheets.
 * El backend ya filtra por HOTEL_ID + USUARIO + ESTADO ENVIADO
 * y solo admite canales WhatsApp/Email.
 */
async function v44CargarPedidosRealizadosHoy(){

  const estadoAnterior=
    new Set(
      v44SentTodayProviders
    );

  v44SentTodayLoaded=false;

  if(
    !session.hotelId ||
    !session.usuario
  ){

    v44SentTodayLoaded=true;
    return [];

  }

  try{

    const r=
      await apiPost({
        accion:"obtener_historial_pedidos",
        hotel_id:session.hotelId,
        usuario_id:session.usuarioId,
        usuario:session.usuario
      });

    const pedidos=
      Array.isArray(r.pedidos)
        ? r.pedidos
        : [];

    const hoy=
      v44HoyKey();

    const nuevos=
      new Set();

    pedidos.forEach(
      pedido=>{

        const fecha=
          v44FechaLocalKey(
            pedido?.fecha
          );

        const proveedorId=
          String(
            pedido?.proveedor_id||""
          ).trim();

        if(
          fecha===hoy &&
          proveedorId
        ){

          nuevos.add(
            proveedorId
          );

        }

      }
    );

    v44SentTodayProviders=
      nuevos;

    v44SentTodayLoaded=true;

    return pedidos;

  }catch(e){

    console.error(
      "No se pudo sincronizar el estado de pedidos realizados:",
      e
    );

    /*
     * Una caída temporal de red no debe borrar un ✓ que acabamos
     * de confirmar localmente tras registrar el pedido.
     */
    v44SentTodayProviders=
      estadoAnterior;

    v44SentTodayLoaded=false;

    return [];

  }
}

/*
 * Tras registrar un pedido correctamente en Sheets, actualizamos
 * inmediatamente la memoria visual para que el usuario vea el ✓
 * sin tener que recargar la página.
 */
function v44MarcarPedidoRealizadoLocalmente(providerId){
  if(providerId){
    v44SentTodayProviders.add(String(providerId));
  }
}

function normalizarCategoria(valor){
  return String(valor||"").trim().replace(/\s+/g," ");
}

function obtenerCategoriasProveedor(providerId){
  const source=getProviderArticles(providerId);
  const mapa=new Map();

  for(const a of source){
    const categoria=normalizarCategoria(a.categoria) || "Otros";
    if(!mapa.has(categoria)) mapa.set(categoria,[]);
    mapa.get(categoria).push(a);
  }

  return Array.from(mapa.entries()).map(([name,items])=>({name,items}))
    .sort((a,b)=>{
      const aOtros=a.name.toLowerCase()==="otros";
      const bOtros=b.name.toLowerCase()==="otros";
      if(aOtros!==bOtros) return aOtros?1:-1;
      return a.name.localeCompare(b.name,"es",{sensitivity:"base"});
    });
}

          ${provider.email?`<a class="detailAction mail" href="mailto:${encodeURIComponent(provider.email)}">✉️ Email</a>`:""}
        </div>`:""}

        + Añadir al pedido

  `;

}

function addArticleFromDetail(cartId){
  changeQty(cartId,1);
  toast("Artículo añadido al pedido");
}

function changeQty(id,delta){
  if(!current){
    toast("Selecciona un proveedor");
    return;
  }

  const article=articles.find(a=>String(a.cartId)===String(id));

  if(!article){
    toast("Artículo no encontrado");
    return;
  }

  /*
   * SEGUNDA BARRERA V28:
   * Un artículo solo puede entrar en el carrito si pertenece
   * al proveedor actualmente abierto.
   */
  if(String(article.providerId)!==String(current.id)){
    console.warn("Intento de añadir artículo de otro proveedor bloqueado",{
      articleId:id,
      articleProviderId:article.providerId,
      currentProviderId:current.id
    });
    toast("Este artículo pertenece a otro proveedor");
    return;
  }

  /*
   * El carrito en memoria queda ligado al proveedor actual.
   * Si por cualquier circunstancia el identificador interno
   * no coincide, empezamos limpio antes de modificarlo.
   */
  if(String(cartProviderId)!==String(current.id)){
    cart={};
    cartProviderId=String(current.id);
    window.pedidoOrigenActualV21="";
  }

  cart[id]=Math.max(0,(cart[id]||0)+delta);

  if(!cart[id])delete cart[id];

  const el=$("q-"+slug(id));
  if(el)el.textContent=cart[id]||0;

  updateCart();

  try{
    if(typeof window.guardarBorradorPedidoV22==="function"){
      window.guardarBorradorPedidoV22();
    }
  }catch(e){}
}
function updateCart(){const total=Object.values(cart).reduce((a,b)=>a+b,0);$("cartCount").textContent=total+" uds."}
function selectedRows(){
  if(!current)return [];

  return Object.entries(cart)
    .map(([id,q])=>({
      a:articles.find(x=>String(x.cartId)===String(id)),
      q
    }))
    .filter(x=>
      x.a &&
      String(x.a.providerId)===String(current.id) &&
      Number(x.q)>0
    )
    .sort((x,y)=>
      x.a.name.localeCompare(
        y.a.name,
        "es",
        {sensitivity:"base"}
      )
    );
}
function formatOrderLine(x,maxLen){
  const formato=String(x?.a?.formato||"").trim();
  const base=`${x.q} ${x.a.name}`;

  if(!formato){
    return `*${base}*`;
  }

  /*
   * V55:
   * La columna del formato se calcula tomando como referencia
   * EL ARTÍCULO MÁS LARGO DEL PEDIDO.
   *
   * No calculamos el ancho de cada texto ni usamos Canvas:
   * todos parten de una misma posición lógica.
   *
   * U+00A0 = espacio no separable, para que WhatsApp conserve
   * la separación entre las dos columnas.
   */
  const faltan=Math.max(
    2,
    maxLen-base.length+4
  );

  const separacion="\u00A0".repeat(faltan);

  return `*${base}*${separacion}_${formato}_`;
}

function buildOrderText(){
  const rows=selectedRows();

  /*
   * Encontramos el artículo más largo del pedido.
   * La longitud incluye la cantidad porque también forma parte
   * de la primera columna.
   */
  const maxLen=rows.reduce((max,x)=>{
    const base=`${x.q} ${x.a.name}`;
    return Math.max(max,base.length);
  },0);

  return `Hola, soy ${session.nombre||session.usuario||""}, te mando el pedido del ${session.hotelNombre||"hotel"}:\n\n${rows.map(x=>formatOrderLine(x,maxLen)).join("\n")}\n\nGracias, un Saludo`;
}

function buildPedidoPayload(channel,rows,extra={}){
  const canal=String(channel||"").trim().toLowerCase();

  let destinatario="";

  if(canal==="whatsapp"){
    destinatario=String(current.whatsapp||"").trim();
  }else if(canal==="email"){
    destinatario=String(current.email||"").trim();
  }else if(canal==="ambos"){
    destinatario=[
      current.whatsapp?`WhatsApp: ${current.whatsapp}`:"",
      current.email?`Email: ${current.email}`:""
    ].filter(Boolean).join(" | ");
  }

  return {
    accion:"crear_pedido",
    hotel_id:session.hotelId,
    hotel_nombre:session.hotelNombre,
    usuario_id:session.usuarioId,
    usuario:session.usuario,
    proveedor_id:current.id,
    proveedor_nombre:current.name,
    canal,
    destinatario,
    pedido_origen_id:extra.pedido_origen_id||"",
    lineas:rows.map(x=>({
      articulo_id:x.a.idOriginal||x.a.cartId,
      articulo_nombre:x.a.name,
      formato:x.a.formato||"",
      cantidad:x.q
    }))
  };
}

async function registrarPedidoEnServidor(channel,rows,extra={}){
  return apiPost(buildPedidoPayload(channel,rows,extra));
}

async function sendOrder(){
  const rows=selectedRows();
  const text=buildOrderText();

  if(!rows.length){
    toast("El pedido está vacío");
    return;
  }

  const hasWhatsApp=!!String(current.whatsapp||"").trim();
  const hasEmail=!!String(current.email||"").trim();

  if(!hasWhatsApp&&!hasEmail){
    toast("Este proveedor no tiene WhatsApp ni email configurado");
    return;
  }

  const canal=hasWhatsApp&&hasEmail
    ? "ambos"
    : hasWhatsApp
      ? "whatsapp"
      : "email";

  /*
   * ------------------------------------------------------------
   * WHATSAPP
   * ------------------------------------------------------------
   *
   * Si existe WhatsApp, lo abrimos primero.
   * Así el navegador no bloquea la ventana.
   *
   * IMPORTANTE:
   * Todavía NO registramos el pedido.
   * Primero completamos todos los canales disponibles.
   */

  let waWindow=null;
  let waUrl="";

  if(hasWhatsApp){
    const digits=
      String(current.whatsapp||"")
        .replace(/\D/g,"")
        .replace(/^34/,"");

    if(!digits){
      toast("El WhatsApp del proveedor no es válido");
      return;
    }

    waUrl=
      "https://wa.me/34"+
      digits+
      "?text="+
      encodeURIComponent(text);

    waWindow=
      window.open(
        waUrl,
        "_blank"
      );
  }


  /*
   * ------------------------------------------------------------
   * EMAIL
   * ------------------------------------------------------------
   *
   * Si existe email, lo enviamos desde Apps Script.
   * Si falla, mantenemos el respaldo mailto.
   */

  let emailOk=false;

  if(hasEmail){

    toast(
      hasWhatsApp
        ? "WhatsApp preparado · enviando email…"
        : "Enviando email…"
    );

    try{

      await apiPost({
        accion:"enviar_email_pedido",
        email:current.email,
        email_copia:current.emailCopia||"",
        proveedor:current.name,
        items:rows.map(x=>({
          nombre:x.a.name,
          formato:x.a.formato||"",
          cantidad:x.q
        })),
        mensaje:text
      });

      emailOk=true;

      toast(
        hasWhatsApp
          ? "WhatsApp preparado · email enviado"
          : "Email enviado correctamente"
      );

    }catch(e){

      console.error(
        "Fallo el envío de email desde Apps Script:",
        e
      );

      /*
       * Respaldo:
       * abrimos el cliente de correo del usuario.
       */
      const cc=
        current.emailCopia
          ? `&cc=${encodeURIComponent(current.emailCopia)}`
          : "";

      const mailto=
        "mailto:"+
        encodeURIComponent(current.email)+
        "?subject="+
        encodeURIComponent("Pedido "+current.name)+
        "&body="+
        encodeURIComponent(text)+
        cc;

      window.location.href=mailto;

      /*
       * Se considera canal intentado mediante el respaldo.
       * El pedido se registrará como enviado si el registro en
       * Sheets se completa correctamente.
       */
      emailOk=true;

      toast(
        hasWhatsApp
          ? "WhatsApp preparado · se abrió el correo como respaldo"
          : "Se abrió el correo como respaldo"
      );
    }
  }


  /*
   * ------------------------------------------------------------
   * WHATSAPP: FALLBACK SI EL NAVEGADOR BLOQUEÓ LA VENTANA
   * ------------------------------------------------------------
   */

  if(
    hasWhatsApp &&
    !waWindow &&
    waUrl
  ){
    window.location.href=waUrl;
  }


  /*
   * ------------------------------------------------------------
   * VALIDAR QUE LOS CANALES HAN PODIDO PREPARARSE
   * ------------------------------------------------------------
   */

  if(
    hasEmail &&
    !emailOk
  ){
    toast(
      hasWhatsApp
        ? "WhatsApp se abrió, pero el email no pudo prepararse"
        : "El email no pudo prepararse"
    );
    return;
  }


  /*
   * ------------------------------------------------------------
   * REGISTRAR UN ÚNICO PEDIDO
   * ------------------------------------------------------------
   *
   * Aunque se utilicen dos canales, aquí solo se crea UN pedido.
   */

  try{

    await registrarPedidoEnServidor(
      canal,
      rows,
      {
        pedido_origen_id:
          window.pedidoOrigenActualV21||""
      }
    );

  }catch(e){

    console.error(
      "No se pudo registrar el pedido:",
      e
    );

    toast(
      "El pedido se preparó, pero no se pudo guardar en el historial"
    );

    return;
  }


  /*
   * ------------------------------------------------------------
   * FINALIZAR
   * ------------------------------------------------------------
   */

  v44MarcarPedidoRealizadoLocalmente(
    current.id
  );

  if(canal==="ambos"){
    toast("Pedido enviado por WhatsApp y Email ✓");
  }else if(canal==="whatsapp"){
    toast("Pedido enviado por WhatsApp ✓");
  }else{
    toast("Pedido enviado por Email ✓");
  }

  /*
   * SOLO AHORA limpiamos el carrito.
   * El pedido ya ha sido preparado por todos los canales
   * disponibles y registrado una sola vez.
   */

  limpiarPedidoTrasEnvioV21();
}
function limpiarPedidoTrasEnvioV21(){
  const providerId=current?.id?String(current.id):"";

  /*
   * El pedido ya ha pasado a WhatsApp/Email.
   * Eliminamos SOLO el borrador del proveedor que acaba de enviarse.
   * Los borradores de todos los demás proveedores permanecen intactos.
   */
  try{
    if(providerId && typeof window.borrarBorradorProveedorV22==="function"){
      window.borrarBorradorProveedorV22(providerId);
    }
  }catch(e){
    console.warn("No se pudo borrar el borrador enviado",e);
  }

  /*
   * Vaciar el carrito visible de la Web App.
   */
  cart={};
  cartProviderId=providerId;
  updateCart();

  window.pedidoOrigenActualV21="";

  /*
   * Compatibilidad con el mecanismo legado V20.
   * También borra únicamente el proveedor actual.
   */
  try{
    if(typeof window.borrarBorradorPedidoV20==="function"){
      window.borrarBorradorPedidoV20();
    }
  }catch(e){}

  closeModal();

  /*
   * Refrescamos únicamente la vista principal para que el ✓ aparezca
   * inmediatamente. La fuente de verdad sigue siendo Sheets.
   */
  try{
    if(typeof renderHome==="function" && v44SentTodayProviders.has(providerId)){
      renderHome(homeFilter);
    }
  }catch(e){
    console.warn("No se pudo refrescar la vista tras enviar el pedido",e);
  }

  /*
   * Dejamos la pantalla en cero para el proveedor enviado.
   * Los demás proveedores siguen conservando sus borradores.
   */

  refreshAfterActionV21();
}


/* ============================================================
   V43 — CIERRE DEL DÍA
   - Consulta el historial centralizado del hotel/usuario actual.
   - Filtra únicamente los pedidos enviados HOY.
   - Incluye proveedor, canal, artículos, cantidades y formatos.
   - El botón prepara un correo mediante mailto.
   - El destinatario queda guardado localmente para no pedirlo
     cada día.
   ============================================================ */

function v43FechaLocalKey(fecha){
  const d=fecha instanceof Date?fecha:new Date(fecha);
  if(Number.isNaN(d.getTime()))return "";
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function v43HoyKey(){
  return v43FechaLocalKey(new Date());
}

function v43PedidosDeHoy(pedidos){
  const hoy=v43HoyKey();
  return (Array.isArray(pedidos)?pedidos:[])
    .filter(p=>v43FechaLocalKey(p.fecha)===hoy)
    .sort((a,b)=>new Date(a.fecha||0)-new Date(b.fecha||0));
}

function v43TotalUnidades(pedidos){
  return (Array.isArray(pedidos)?pedidos:[]).reduce((total,p)=>{
    const lineas=Array.isArray(p.lineas)?p.lineas:[];
    return total+lineas.reduce((s,l)=>s+(Number(l.cantidad)||0),0);
  },0);
}

function v43ConstruirResumenTexto(pedidos){
  const fecha=new Date().toLocaleDateString("es-ES",{
    weekday:"long",day:"numeric",month:"long",year:"numeric"
  });

  const partes=[];
  partes.push(`CIERRE DEL DÍA — ${fecha}`);
  partes.push(`Hotel: ${session.hotelNombre||""}`);
  partes.push(`Usuario: ${session.nombre||session.usuario||""}`);
  partes.push("");

  if(!pedidos.length){
    partes.push("No hay pedidos enviados hoy.");
    return partes.join("\n");
  }

  partes.push(`PEDIDOS REALIZADOS: ${pedidos.length}`);
  partes.push(`TOTAL UNIDADES: ${v43TotalUnidades(pedidos)}`);
  partes.push("");

  pedidos.forEach((pedido,index)=>{
    const canal=String(pedido.canal||"").toLowerCase()==="whatsapp"
      ?"WhatsApp":"Email";
    const hora=pedido.fecha
      ?new Date(pedido.fecha).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})
      :"";
    partes.push(`PROVEEDOR ${index+1}: ${pedido.proveedor_nombre||"Proveedor"}`);
    partes.push(`Canal: ${canal}${hora?" · Hora: "+hora:""}`);

    const lineas=Array.isArray(pedido.lineas)?pedido.lineas:[];
    lineas.forEach(linea=>{
      const cantidad=Number(linea.cantidad)||0;
      const nombre=linea.articulo_nombre||"Artículo";
      const formato=String(linea.formato||"").trim();
      partes.push(`${cantidad} × ${nombre}${formato?" — Formato: "+formato:""}`);
    });

    partes.push("");
  });

  return partes.join("\n").trim();
}

function v43ConstruirResumenHtml(pedidos){
  if(!pedidos.length){
    return `<div class="empty">No hay pedidos enviados hoy.</div>`;
  }

  return pedidos.map((pedido,index)=>{
    const canal=String(pedido.canal||"").toLowerCase()==="whatsapp"
      ?"WhatsApp":"Email";
    const hora=pedido.fecha
      ?new Date(pedido.fecha).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})
      :"";
    const lineas=Array.isArray(pedido.lineas)?pedido.lineas:[];
    const total=lineas.reduce((s,l)=>s+(Number(l.cantidad)||0),0);

    return `<div class="dayCloseSummaryV43">
      <div class="dayCloseSummaryHeadV43">
        <div class="dayCloseSummaryProviderV43">${index+1}. ${esc(pedido.proveedor_nombre||"Proveedor")}</div>
        <div class="dayCloseSummaryMetaV43">${esc(canal)}${hora?" · "+esc(hora):""} · ${total} uds.</div>
      </div>
      ${lineas.map(l=>`
        <div class="dayCloseSummaryLineV43">
          <strong>${Number(l.cantidad)||0}</strong>
          <span>${esc(l.articulo_nombre||"Artículo")}${l.formato?`<small style="display:block;color:#718096;margin-top:2px">Formato: ${esc(l.formato)}</small>`:""}</span>
        </div>
      `).join("")}
    </div>`;
  }).join("");
}

async function refreshAfterActionV21(options = {}){

  const currentProviderId=
    current?.id
      ? String(current.id)
      : "";

  const currentFilter=
    String(
      productFilter||""
    );

  const homeFilterSaved=
    String(
      homeFilter||""
    );

  /*
   * PRIMERO: respuesta visual inmediata.
   * No esperamos a Google Sheets para actualizar la pantalla.
   */
  try{

    if(
      currentProviderId &&
      providersById.has(currentProviderId)
    ){

      renderProviderArticles(
        currentFilter
      );

      updateCart();

    }else{

      renderHome(
        homeFilterSaved
      );

    }

  }catch(e){

    console.warn(
      "No se pudo refrescar inmediatamente la interfaz:",
      e
    );

  }

  /*
   * SEGUNDO: sincronización real en segundo plano.
   */
  try{

    await cargarDatos();

    await v44CargarPedidosRealizadosHoy();

    if(
      currentProviderId &&
      providersById.has(currentProviderId)
    ){

      openProvider(
        currentProviderId,
        currentFilter
      );

    }else{

      renderHome(
        homeFilterSaved
      );

    }

  }catch(error){

    console.error(
      "Error actualizando datos después de la acción:",
      error
    );

    /*
     * No hacemos location.reload().
     * La interfaz que ya estaba funcionando se mantiene.
     */
    try{

      if(
        currentProviderId &&
        providersById.has(currentProviderId)
      ){

        renderProviderArticles(
          currentFilter
        );

        updateCart();

      }else{

        renderHome(
          homeFilterSaved
        );

      }

    }catch(e){}

  }

}

function repetirPedidoV21(pedido){
  if(!pedido || !Array.isArray(pedido.lineas) || !pedido.lineas.length){
    toast("Este pedido no tiene líneas recuperables");
    return;
  }

  const provider=providers.find(p=>String(p.id)===String(pedido.proveedor_id));
  if(!provider){
    toast("El proveedor de este pedido ya no está disponible en este hotel");
    return;
  }

  current=provider;
  productFilter="";
  window.pedidoOrigenActualV21=String(pedido.id||"");

  /*
   * Recuperación robusta:
   * 1. ID del artículo.
   * 2. Código del artículo, si está disponible.
   * 3. Nombre normalizado como último respaldo.
   */
  const restored={};
  const faltantes=[];
  const usadosCartIds=new Set();

  const normalizarClave=valor =>
    String(valor||"")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"");

  const buscarArticuloHistorico=linea => {

    const lineaId=String(
      linea.articulo_id ??
      linea.ARTICULO_ID ??
      ""
    ).trim();

    if(lineaId){

      const byId=articles.find(a=>{
        const aid=String(a.idOriginal||"").trim();
        const cid=String(a.cartId||"").trim();
        return aid===lineaId || cid===lineaId;
      });

      if(byId) return byId;
    }

    const lineaCodigo=String(
      linea.articulo_codigo ??
      linea.codigo ??
      linea.CODIGO ??
      ""
    ).trim();

    if(lineaCodigo){

      const byCode=articles.find(a=>
        String(a.codigo||"").trim()===lineaCodigo &&
        String(a.providerId)===String(provider.id)
      );

      if(byCode) return byCode;
    }

    const lineaNombre=normalizarClave(
      linea.articulo_nombre ??
      linea.nombre ??
      linea.ARTICULO_NOMBRE ??
      ""
    );

    if(lineaNombre){

      const candidatos=articles.filter(a=>
        String(a.providerId)===String(provider.id) &&
        normalizarClave(a.name)===lineaNombre
      );

      if(candidatos.length===1) return candidatos[0];

      const libre=candidatos.find(a=>
        !usadosCartIds.has(String(a.cartId))
      );

      if(libre) return libre;
    }

    return null;
  };

  pedido.lineas.forEach(linea=>{

    const article=buscarArticuloHistorico(linea);

    const cantidad=
      Number(
        linea.cantidad ??
        linea.CANTIDAD ??
        0
      ) || 0;

    if(article && cantidad>0){

      const key=String(article.cartId);

      restored[key]=
        (restored[key]||0)+cantidad;

      usadosCartIds.add(key);

    }else{

      faltantes.push(
        linea.articulo_nombre ||
        linea.nombre ||
        "Artículo"
      );

    }

  });

  if(!Object.keys(restored).length){

    toast(
      "No se pudieron asociar los artículos de este pedido con los artículos actuales"
    );

    return;
  }

  closeModal();

  /*
   * Abrimos el proveedor para construir su pantalla.
   * El pedido histórico tendrá prioridad sobre cualquier borrador.
   */
  openProvider(
    current.id,
    ""
  );

  cart={
    ...restored
  };

  cartProviderId=
    String(current.id);

  window.pedidoOrigenActualV21=
    String(pedido.id||"");

  /*
   * Pintamos otra vez DESPUÉS de restaurar cart.
   */
  renderProviderArticles(
    productFilter
  );

  updateCart();

  /*
   * Guardamos el pedido recuperado como borrador editable.
   * Esto NO modifica el pedido original.
   */
  try{

    if(
      typeof window.guardarBorradorPedidoV22==="function"
    ){

      window.guardarBorradorPedidoV22();

    }

  }catch(e){

    console.warn(
      "No se pudo guardar el pedido recuperado como borrador",
      e
    );

  }

  if(faltantes.length){

    setTimeout(()=>{

      toast(
        "Pedido recuperado. Se omitieron artículos que ya no están activos: "+
        faltantes.join(", ")
      );

    },250);

  }else{

    setTimeout(()=>{

      toast(
        "Pedido recuperado. Puedes modificarlo antes de enviarlo."
      );

    },250);

  }
}

function categoriasParaProveedor(providerId,excludeArticleId=""){
  const set=new Set();
  for(const a of getProviderArticles(providerId)){

    const c=normalizarCategoria(a.categoria);
    if(c) set.add(c);

  return [...set].sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));
}

   INDEX71 — CORRECCIÓN CALENDARIO + TARJETAS DE PROVEEDORES
   Se conserva toda la lógica existente de pedidos/borradores.
   ============================================================ */

function normalizarIdV71(valor){
  return String(valor??"").trim();
}

function diaCalendarioANumeroV71(valor){
  const raw=String(valor??"")
    .trim().toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"")
    .replace(/\s+/g,"");
  if(/^[1-7]$/.test(raw)) return Number(raw);
  const map={
    LUNES:1,LUN:1,
    MARTES:2,MAR:2,
    MIERCOLES:3,MIER:3,
    JUEVES:4,JUE:4,
    VIERNES:5,VIE:5,
    SABADO:6,SAB:6,
    DOMINGO:7,DOM:7
  };
  return map[raw]||0;
}

/* Rehacemos el índice del calendario de forma tolerante:
   - ID con espacios
   - nombres de día con/sin tilde
   - día numérico 1..7
   - respuestas antiguas que incluyan nombre del proveedor */
cargarCalendarioEnMemoria = function(lista){
  const raw=Array.isArray(lista)?lista:[];
  providerCalendar=raw.map(x=>({
    hotelId:normalizarIdV71(x.hotelId??x.HOTEL_ID),
    providerId:normalizarIdV71(x.proveedorId??x.PROVEEDOR_ID),
    providerName:normalizarIdV71(x.proveedorNombre??x.PROVEEDOR_NOMBRE??x.nombreProveedor??x.NOMBRE_PROVEEDOR),
    diaPedido:String(x.diaPedido??x.DIA_PEDIDO??"").trim(),
    diaEntrega:String(x.diaEntrega??x.DIA_ENTREGA??"").trim(),
    activo:String(x.activo??x.ACTIVO??true).toLowerCase()!=="false"
  })).filter(x=>x.providerId&&x.activo);

  calendarByProvider=new Map();

  providerCalendar.forEach(row=>{
    const key=normalizarIdV71(row.providerId);
    if(!calendarByProvider.has(key)) calendarByProvider.set(key,[]);
    calendarByProvider.get(key).push(row);
  });

  /* Compatibilidad defensiva por nombre si una respuesta histórica
     trae el mismo proveedor con un formato distinto de ID. */
  providers.forEach(p=>{
    const pid=normalizarIdV71(p.id);
    if(calendarByProvider.has(pid)) return;
    const pn=normalizarTextoBusquedaSeguro(p.name);
    const matches=providerCalendar.filter(row=>
      row.providerName &&
      normalizarTextoBusquedaSeguro(row.providerName)===pn
    );
    if(matches.length) calendarByProvider.set(pid,matches);
  });
};

cargarCalendario = async function(){
  if(!session.hotelId){
    cargarCalendarioEnMemoria([]);
    return;
  }
  const r=await apiPost({
    accion:"obtener_calendario_proveedores",
    hotelId:session.hotelId
  });
  cargarCalendarioEnMemoria(r.calendario||r.datos||[]);
};

getProviderCalendarInfo = function(providerId){
  const rows=calendarByProvider.get(normalizarIdV71(providerId))||[];
  if(!rows.length){
    return {
      today:false,
      delivery:"",
      nextDay:"",
      nextDelivery:"",
      hasCalendar:false
    };
  }

  const today=diaHoyCalendario();
  const candidates=[];
  const todayRows=[];

  rows.forEach(row=>{
    const pedido=diaCalendarioANumeroV71(row.diaPedido);
    if(!pedido) return;

    const delta=(pedido-today+7)%7;
    if(delta===0) todayRows.push(row);

    candidates.push({
      row,
      delta:delta===0?7:delta
    });
  });

  const next=candidates.sort((a,b)=>a.delta-b.delta)[0];

  return {
    today:todayRows.length>0,
    delivery:todayRows.length
      ? String(todayRows[0].diaEntrega||"").trim()
      : "",
    nextDay:next
      ? String(next.row.diaPedido||"").trim()
      : "",
    nextDelivery:next
      ? String(next.row.diaEntrega||"").trim()
      : "",
    hasCalendar:candidates.length>0
  };
};

function v38ReadDrafts(){

function v38GetDraft(providerId){

function v38DraftUnits(d){

}

<script>
(function(){
  /* ============================================================
     BORRADORES V22 — UNO POR PROVEEDOR
     - Solo guarda pedidos NO enviados.
     - Se separan por HOTEL + USUARIO + PROVEEDOR.
     - No entran en PEDIDOS ni en Historial hasta enviar.
     - Se recuperan desde el propio proveedor mediante "Ver pedido".
     ============================================================ */

  function draftStoreKey(){
    const hotel=String(session?.hotelId||"SIN-HOTEL");
    const usuario=String(session?.usuario||session?.usuarioId||"SIN-USUARIO");
    return "ECONOMATO_BORRADORES_V22_"+hotel+"_"+usuario;
  }

  function readStore(){
    try{return JSON.parse(localStorage.getItem(draftStoreKey())||"{}")}catch(e){return {}}
  }

  function writeStore(store){
    try{localStorage.setItem(draftStoreKey(),JSON.stringify(store))}catch(e){console.warn("No se pudieron guardar los borradores",e)}
  }

  function saveDraftForProvider(providerId){
    try{
      if(!providerId || !session) return;
      const ids=Object.keys(cart||{});
      const store=readStore();

      if(!ids.length){
        delete store[String(providerId)];
        writeStore(store);
        return;
      }

      store[String(providerId)]={
        version:22,
        savedAt:new Date().toISOString(),
        hotelId:session.hotelId||"",
        hotelNombre:session.hotelNombre||"",
        usuarioId:session.usuarioId||"",
        usuario:session.usuario||"",
        providerId:String(providerId),
        providerName:current?.name||"",
        pedidoOrigenId:window.pedidoOrigenActualV21||"",
        cart:{...cart}
      };
      writeStore(store);
      try{ if(typeof renderHome==="function" && !current) renderHome(homeFilter||""); }catch(e){}
    }catch(e){console.warn("No se pudo guardar el borrador",e)}
  }

  function getDraft(providerId){
    try{
      const d=readStore()[String(providerId)]||null;
      if(!d) return null;

      if(d.hotelId && session?.hotelId && String(d.hotelId)!==String(session.hotelId)) return null;
      if(d.usuario && session?.usuario && String(d.usuario)!==String(session.usuario)) return null;

      const age=Date.now()-new Date(d.savedAt).getTime();
      if(!Number.isFinite(age)||age>7*24*60*60*1000){
        deleteStore(providerId);
        return null;
      }
      return d;
    }catch(e){return null}
  }

  function deleteStore(providerId){
    const store=readStore();
    delete store[String(providerId)];
    writeStore(store);
  }

  function saveCurrent(){
    if(current?.id) saveDraftForProvider(current.id);
  }

  function clearAllDrafts(){
    try{localStorage.removeItem(draftStoreKey())}catch(e){}
  }

  function openDraft(providerId){
    const d=getDraft(providerId);
    if(!d){toast("No hay ningún borrador para este proveedor");return}

    const provider=providers.find(p=>String(p.id)===String(providerId));
    if(!provider){toast("El proveedor ya no está disponible");return}

    current=provider;
    cartProviderId=String(provider.id);
    cart={...(d.cart||{})};
    window.pedidoOrigenActualV21=d.pedidoOrigenId||"";
    openProvider(provider.id,"");
    setTimeout(()=>toast("Borrador recuperado. Puedes continuar el pedido."),150);
  }

  window.guardarBorradorPedidoV22=saveCurrent;
  window.obtenerBorradorProveedorV22=getDraft;
  window.borrarBorradorProveedorV22=deleteStore;
  window.verBorradorProveedorV22=openDraft;
  window.borrarTodosLosBorradoresV22=clearAllDrafts;

  // Compatibilidad con las llamadas V21 que ya existen.
  window.guardarBorradorPedidoV20=saveCurrent;
  window.borrarBorradorPedidoV20=function(){
    if(current?.id) deleteStore(current.id);
  };
  window.obtenerBorradorPedidoV20=function(){
    return current?.id ? getDraft(current.id) : null;
  };

  setInterval(saveCurrent,3000);
  window.addEventListener("beforeunload",saveCurrent);

<script id="index80-order-behavior">
/* ============================================================
   INDEX80 — PEDIDO NUEVO / RESTABLECER / HISTORIAL
   ============================================================ */
function restablecerPedidoV80(){
  if(!current){
    toast("No hay un pedido activo");
    return;
  }

  const total=Object.values(cart||{}).reduce((sum,q)=>sum+(Number(q)||0),0);
  if(total>0 && !window.confirm("¿Quieres cancelar este pedido y poner todas las cantidades a cero?")) return;

  const providerId=String(current.id||"");

  cart={};
  cartProviderId=providerId;
  window.pedidoOrigenActualV21="";

  try{
    if(providerId && typeof window.borrarBorradorProveedorV22==="function"){
      window.borrarBorradorProveedorV22(providerId);
    }
  }catch(e){
    console.warn("No se pudo borrar el borrador del pedido",e);
  }

  try{
    if(typeof window.borrarBorradorPedidoV20==="function") window.borrarBorradorPedidoV20();
  }catch(e){}

  updateCart();
  closeModal();

  try{
    renderProviderArticles(productFilter||"");
  }catch(e){
    console.warn("No se pudo refrescar la lista tras restablecer",e);
  }

  toast("Pedido restablecido a cero");
}

/* Resumen definitivo: nombre primero, cantidad al extremo derecho. */
function openSummary(){
  if(!current||!Object.keys(cart||{}).length){
    toast("Añade al menos un artículo");
    return;
  }

  const rows=selectedRows();
  if(!rows.length){
    toast("El pedido está vacío");
    return;
  }

  const hasChannel=!!(current.whatsapp||current.email);

  $("sheet").innerHTML=`
    <div class="summaryBrand">
      <div class="summaryLogo"><img src="${LOGO}" alt="Hotel"></div>
      <div>
        <strong>${esc(session.hotelNombre||"HOTEL")}</strong>
        <small>ML Hoteles · Pedido de economato</small>
      </div>
    </div>
    <h2>Resumen del pedido</h2>
    <div class="sub">Proveedor: ${esc(current.name)}</div>
    <div class="summary">
      ${rows.map(x=>`
        <div class="sumrow">
          <span>
            <strong style="display:block;font-size:15px;line-height:1.3;font-weight:900;color:#172033">${esc(x.a.name)}</strong>
            ${x.a.formato?`<small>${esc(x.a.formato)}</small>`:""}
          </span>
          <strong>${Number(x.q)||0}</strong>
        </div>
      `).join("")}
    </div>

    ${hasChannel
      ? `<div class="actions">
          <button class="action ${current.whatsapp&&current.email?"wa":"mail"}" onclick="sendOrder()">📤 Enviar pedido</button>
        </div>`
      : `<div class="empty">Este proveedor no tiene WhatsApp ni email configurado.</div>`
    }

    <button class="resetOrderV80" type="button" onclick="restablecerPedidoV80()">↺ Cancelar / restablecer pedido</button>
    <button class="secondary" type="button" onclick="closeModal()">Seguir modificando</button>
  `;

  $("modal").classList.add("show");
}

/* Historial visual: nombre primero, cantidad después. */
function verPedidoHistorialV74(pedido){
  const lines=Array.isArray(pedido?.lineas)?pedido.lineas:[];
  const canal=String(pedido?.canal||"").toLowerCase();
  const canalTexto=canal==="ambos"?"WhatsApp + Email":canal==="whatsapp"?"WhatsApp":"Email";
  const fecha=pedido?.fecha?new Date(pedido.fecha):null;
  const fechaTexto=fecha&&!Number.isNaN(fecha.getTime()) ? fecha.toLocaleString("es-ES") : String(pedido?.fecha||"");

  $("sheet").innerHTML=`
    <h2>${esc(pedido?.proveedor_nombre||"Pedido")}</h2>
    <div class="sub">${esc(fechaTexto)} · ${esc(canalTexto)}</div>
    <div class="history" style="margin-top:14px">
      ${lines.length ? lines.map(x=>`
        <div class="order" style="margin-bottom:8px">
          <div class="historyOrderLineV80">
            <div class="historyOrderNameV80">
              <strong style="font-size:15px;line-height:1.3">${esc(x.articulo_nombre||"Artículo")}</strong>
              ${x.formato?`<small style="display:block;margin-top:3px;color:#718096;font-size:12px">${esc(x.formato)}</small>`:""}
            </div>
            <strong class="historyOrderQtyV80" style="font-size:18px">${Number(x.cantidad)||0}</strong>
          </div>
        </div>
      `).join("") : `<div class="empty">Este pedido no tiene líneas.</div>`}
    </div>
    <button class="secondary" onclick="showHistory()">Volver al historial</button>`;
  $("modal").classList.add("show");
}
</script>

<script id="economato-v81-2-mobile-keyboard">
/*
 * V81.2 — Ayuda al navegador móvil a mantener visible el campo
 * de búsqueda cuando aparece el teclado.
 *
 * No sustituye ni modifica renderProviderArticles().
 * Solo actúa cuando el usuario pone el foco en un buscador existente.
 */
(function(){
  function keepSearchVisible(input){
    if(!input) return;

    setTimeout(function(){
      try{
        input.scrollIntoView({
          behavior:"smooth",
          block:"center",
          inline:"nearest"
        });
      }catch(e){}
    },180);
  }

  document.addEventListener("focusin",function(ev){
    var el=ev.target;
    if(!el || !el.matches) return;
    if(el.matches("#providerArticleSearchV74,#categoryArticleSearchV57")){
      keepSearchVisible(el);
    }
  },true);

  if(window.visualViewport){
    window.visualViewport.addEventListener("resize",function(){
      var el=document.activeElement;
      if(!el || !el.matches) return;
      if(el.matches("#providerArticleSearchV74,#categoryArticleSearchV57")){
        setTimeout(function(){
          keepSearchVisible(el);
        },80);
      }
    });
  }
})();
</script>

<script id="economato-v81-3-search">
/*

 * BUSCADOR DE ARTÍCULOS DE PROVEEDOR/CATEGORÍA
 *
 * El buscador global usa:
 *   articuloCoincide() + ordenarArticulosPorNombre()
 *
 * Aquí usamos EXACTAMENTE esos mismos motores de coincidencia y
 * ordenación, pero limitando la fuente al proveedor/categoría.
 *
 * CLAVE:
 *   El input se crea una sola vez.
 *   Al escribir SOLO se actualiza el div de resultados.
 *   Nunca se vuelve a crear el input por cada letra.
 */

function renderProviderArticleResultsV81(filter="", source=[]){
  const box=$("providerArticleResultsV81");
  if(!box) return;

  const q=String(filter||"").trim();
  const matches=ordenarArticulosPorNombre(
    source.filter(a=>articuloCoincide(a,q))
  );

  box.innerHTML=matches.length
    ? matches.map(a=>{
        const img=a.image
          ? `<img class="productImageV58" src="${escAttr(a.image)}" alt="" loading="lazy">`
          : `<span class="productImageFallbackV58">${esc(a.name.charAt(0).toUpperCase())}</span>`;

        return `
          <div class="product productRowV58"
               onclick="openArticleDetail('${escAttr(a.cartId)}')"
               role="button" tabindex="0"
               onkeydown="if(event.key==='Enter'||event.key===' ')openArticleDetail('${escAttr(a.cartId)}')">
            <div class="productInfoV58">
              <div class="productImageWrapV58">${img}</div>
              <div class="productTextV58">
                <div class="productname">${esc(a.name)}</div>
                ${a.formato?`<small class="productFormatV58">${esc(a.formato)}</small>`:""}
                ${a.codigo?`<small class="productCodeV58">Código · ${esc(a.codigo)}</small>`:""}
                ${a.categoria?`<small class="productCategoryV74">${esc(a.categoria)}</small>`:""}
              </div>
            </div>
            <div class="qty qtyV58">
              <button type="button" aria-label="Restar"
                onclick="event.stopPropagation();changeQty('${escAttr(a.cartId)}',-1)">−</button>
              <div class="num" id="q-${slug(a.cartId)}">${cart[a.cartId]||0}</div>
              <button type="button" aria-label="Añadir"
                onclick="event.stopPropagation();changeQty('${escAttr(a.cartId)}',1)">+</button>
            </div>
          </div>`;
      }).join("")
    : `<div class="categoryEmptyV57">No hay artículos que coincidan con tu búsqueda.</div>`;
}

function updateProviderArticleSearchV81(filter=""){
  productFilter=String(filter||"");
  const source=getProviderArticles(current.id);
  renderProviderArticleResultsV81(productFilter,source);

  const headerBox=$("categoryHeaderV57");
  if(headerBox){
    const q=String(productFilter||"").trim();
    headerBox.querySelector("span") &&
      (headerBox.querySelector("span").textContent =
        `${source.length} artículo${source.length===1?"":"s"}${q?` · filtrados por “${q}”`:""}`);
  }
}

<script id="economato-v81-5-nav-search">
/* ============================================================
   V81.5 — BUSCADOR INICIAL REAL
   Al elegir Proveedores/Artículos no se abre una segunda ventana:
   la propia tarjeta de selección se transforma en el buscador.
   Así no se cierra ni se pierde la interacción.
   ============================================================ */

function openV40SearchModeV81(type){
  const m=document.getElementById("v40SearchChooser");
  if(!m)return;

  const card=m.querySelector(".v40-search-choice-card");
  if(!card)return;

  const isProvider=type==="provider";
  const title=isProvider?"Buscar proveedor":"Buscar artículo";
  const placeholder=isProvider
    ?"Escribe el nombre del proveedor…"
    :"Escribe el nombre del artículo…";
  const inputId=isProvider?"v40ProviderSearchV81":"v40ArticleSearchV81";
  const resultsId=isProvider?"v40ProviderResultsV81":"v40ArticleResultsV81";
  const renderFn=isProvider?"renderV40ProviderResultsV81":"renderV40ArticleResultsV81";

  card.innerHTML=`
    <div class="v40-search-choice-head">
      <div id="v40SearchChooserTitle" class="v40-search-choice-title">${title}</div>
      <button type="button" class="v40-search-choice-close"
              onclick="closeV40SearchChooser()" aria-label="Cerrar">×</button>
    </div>

    <div class="v81GlobalSearchBox">
      <span aria-hidden="true">⌕</span>
      <input id="${inputId}" type="search"
             placeholder="${placeholder}"
             autocomplete="off"
             autocorrect="off"
             autocapitalize="none"
             spellcheck="false"
             oninput="${renderFn}(this.value)">
    </div>

    <div id="${resultsId}" class="v81GlobalSearchResults"></div>
  `;

  m.classList.add("open");
  m.setAttribute("aria-hidden","false");

  const input=document.getElementById(inputId);
  if(input){
    setTimeout(()=>{
      input.focus();
      input.select();
    },50);
  }

  if(isProvider) renderV40ProviderResultsV81("");
  else renderV40ArticleResultsV81("");
}

function openV40ProviderSearch(){
  openV40SearchModeV81("provider");
}

function openV40ArticleSearch(){
  openV40SearchModeV81("article");
}

function renderV40ProviderResultsV81(filter=""){
  const box=document.getElementById("v40ProviderResultsV81");
  if(!box)return;

  const q=normalizarTextoBusquedaSeguro(String(filter||"").trim());

  if(!q){
    box.innerHTML=`<div class="v81SearchEmpty">Escribe para buscar un proveedor.</div>`;
    return;
  }

  const matches=providers
    .filter(p=>String(p.searchName||normalizarTextoBusquedaSeguro(p.name)).includes(q))
    .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"es",{sensitivity:"base"}));

  box.innerHTML=matches.length
    ? matches.map(p=>`
      <button type="button" class="v81GlobalResult"
              onclick="openGlobalProviderResultV81('${escAttr(p.id)}')">
        <span class="v81GlobalResultIcon">${esc(String(p.name||"?").charAt(0).toUpperCase())}</span>
        <span class="v81GlobalResultMain">
          <strong>${esc(p.name)}</strong>
          <small>${getProviderArticles(p.id).length} artículos · ${p.whatsapp&&p.email?"WhatsApp + Email":p.whatsapp?"WhatsApp":p.email?"Email":"Sin contacto"}</small>
        </span>
        <span class="v81GlobalResultArrow">›</span>
      </button>
    `).join("")
    : `<div class="v81SearchEmpty">No se encontraron proveedores.</div>`;
}

function renderV40ArticleResultsV81(filter=""){
  const box=document.getElementById("v40ArticleResultsV81");
  if(!box)return;

  const q=String(filter||"").trim();

  if(!q){
    box.innerHTML=`<div class="v81SearchEmpty">Escribe para buscar un artículo.</div>`;
    return;
  }

  const matches=ordenarArticulosPorNombre(
    articles.filter(a=>articuloCoincide(a,q))
  );

  box.innerHTML=matches.length
    ? matches.map(a=>{
        const p=providersById.get(String(a.providerId));
        return `
          <button type="button" class="v81GlobalResult"
                  onclick="openGlobalArticleResultV81('${escAttr(a.cartId)}')">
            <span class="v81GlobalResultIcon articleIcon">${esc(String(a.name||"?").charAt(0).toUpperCase())}</span>
            <span class="v81GlobalResultMain">
              <strong>${esc(a.name)}</strong>
              <small>${p?esc(p.name):"Sin proveedor"}${a.categoria?" · "+esc(a.categoria):""}${a.formato?" · "+esc(a.formato):""}</small>
            </span>
            <span class="v81GlobalResultArrow">›</span>
          </button>`;
      }).join("")
    : `<div class="v81SearchEmpty">No se encontraron artículos.</div>`;
}

/* ---------- navegación de resultados ---------- */

function openGlobalProviderResultV81(providerId){
  closeV40SearchChooser();

  const provider=providers.find(p=>String(p.id)===String(providerId));
  if(!provider){
    toast("Proveedor no encontrado");
    return;
  }

  openProvider(provider.id,"");
}

function openGlobalArticleResultV81(cartId){
  closeV40SearchChooser();

  const article=articles.find(a=>String(a.cartId)===String(cartId));
  if(!article){
    toast("Artículo no encontrado");
    return;
  }

  const provider=providers.find(p=>String(p.id)===String(article.providerId));
  if(!provider){
    toast("El proveedor del artículo no está disponible");
    return;
  }

  current=provider;
  cartProviderId=String(provider.id);
  productFilter="";
  currentCategory="";

  const draft=typeof window.obtenerBorradorProveedorV22==="function"
    ? window.obtenerBorradorProveedorV22(provider.id)
    : null;

  if(draft && draft.cart && typeof draft.cart==="object"){
    cart={...draft.cart};
    window.pedidoOrigenActualV21=draft.pedidoOrigenId||"";
  }else{
    cart={};
    window.pedidoOrigenActualV21="";
  }

  openArticleDetail(article.cartId);

  setTimeout(()=>{
    const back=document.querySelector(".articleDetailPageV81 .providerBackV57");
    if(back){
      back.setAttribute("onclick",`openProvider('${escAttr(provider.id)}','')`);
    }
  },0);
}

/* Al cerrar desde cualquier estado, restauramos el selector original. */
const v81OriginalChooserHTML=`
    <div class="v40-search-choice-head">
      <div id="v40SearchChooserTitle" class="v40-search-choice-title">¿Qué quieres buscar?</div>
      <button type="button" class="v40-search-choice-close"
              onclick="closeV40SearchChooser()" aria-label="Cerrar">×</button>
    </div>

    <button type="button" class="v40-search-choice-option"
            onclick="openV40ProviderSearch()">
      <span class="v40-search-choice-icon providerIcon">
        <svg viewBox="0 0 32 32" width="25" height="25" fill="none" aria-hidden="true">
          <circle cx="14" cy="14" r="8.5" stroke="currentColor" stroke-width="2.4"/>
          <path d="M20.5 20.5L28 28" stroke="currentColor" stroke-width="2.4"/>
        </svg>
      </span>
      <span><strong>Proveedores</strong><span class="description">Buscar un proveedor</span></span>
    </button>

    <button type="button" class="v40-search-choice-option"
            onclick="openV40ArticleSearch()">
      <span class="v40-search-choice-icon article"><span style="font-size:23px">🥤</span></span>
      <span><strong>Artículos</strong><span class="description">Buscar un artículo</span></span>
    </button>
`;

function closeV40SearchChooser(){
  const m=document.getElementById("v40SearchChooser");
  if(!m)return;

  const card=m.querySelector(".v40-search-choice-card");
  if(card)card.innerHTML=v81OriginalChooserHTML;

  m.classList.remove("open");
  m.setAttribute("aria-hidden","true");
}
</script>

<script id="economato-v81-6-clean-nav-js">
(function(){
  function updateEconomatoNavV81(){
    const nav=document.querySelector(
      '.providerPageV58 > .providerNavV81, .articleDetailPageV81 > .providerNavV81'
    );
    if(!nav){
      return;
    }

    if(window.scrollY > 45){
      nav.classList.add('providerNavFloatingV81');
    }else{
      nav.classList.remove('providerNavFloatingV81');
    }
  }

  window.addEventListener('scroll',updateEconomatoNavV81,{passive:true});
  window.addEventListener('resize',updateEconomatoNavV81,{passive:true});

  const observer=new MutationObserver(function(){
    requestAnimationFrame(updateEconomatoNavV81);
  });

  const content=document.getElementById('content');
  if(content){
    observer.observe(content,{childList:true,subtree:true});
  }

  window.updateEconomatoNavV81=updateEconomatoNavV81;
  requestAnimationFrame(updateEconomatoNavV81);
})();
</script>

<script>
/* ============================================================
   ECONOMATO V88 — MOTOR DE PROVEEDOR
   Mantiene el motor existente de búsqueda/cantidades.
   Solo cambia la distribución visual y la zona de scroll.
   ============================================================ */

function v88SelectedTotal(){
  return Object.values(cart||{}).reduce((sum,q)=>sum+(Number(q)||0),0);
}

function v88RefreshSelected(){
  const el=document.getElementById("providerSelectedV88");
  if(el) el.textContent=v88SelectedTotal()+" seleccionados";
}

function updateCart(){
  const total=Object.values(cart||{}).reduce((a,b)=>a+(Number(b)||0),0);
  const cartCount=document.getElementById("cartCount");
  if(cartCount) cartCount.textContent=total+" uds.";
  v88RefreshSelected();
}

function v88RenderControls(){
  if(!current) return;

  const controls=document.getElementById("providerControlsV88");
  if(!controls) return;

  const source=getProviderArticles(current.id);
  const categories=obtenerCategoriasProveedor(current.id).map(c=>c.name);
  const active=normalizarCategoria(currentCategory||"");

  controls.innerHTML=`
    <div class="providerControlsTitleV88">
      <span>${active ? "Categoría · "+esc(active) : "Categorías"}</span>
      <span>${source.length} artículos</span>
    </div>

    <div class="providerCategoryScrollerV88">
      <button type="button"
        class="providerCategoryChipV88 ${active===""?"active":""}"
        onclick="currentCategory='';productFilter='';v88RenderControls();renderProviderArticles('')">
        Todos · ${source.length}
      </button>
      ${categories.map(c=>`
        <button type="button"
          class="providerCategoryChipV88 ${normalizarCategoria(c)===active?"active":""}"
          onclick="openProviderCategory('${escAttr(c)}')">
          ${esc(c)}
        </button>
      `).join("")}
    </div>

    <div class="providerSearchV88">
      <span>⌕</span>
      <input
        id="providerArticleSearchV88"
        type="search"
        placeholder="Buscar en ${esc(active||current.name)}…"
        value="${esc(productFilter||"")}"
        autocomplete="off"
        oninput="productFilter=this.value;renderProviderArticles(this.value,false)"
      >
    </div>
  `;
}

function v88RenderArticleRows(list, source, filter){
  const container=document.getElementById("providerArticleList");
  if(!container) return;

  const rows=list.map(a=>{
    const img=a.image
      ? `<img class="productImageV58" src="${escAttr(a.image)}" alt="" loading="lazy">`
      : `<span class="productImageFallbackV58">${esc(a.name.charAt(0).toUpperCase())}</span>`;

    return `
      <div class="product productRowV58"
           onclick="openArticleDetail('${escAttr(a.cartId)}')"
           role="button" tabindex="0"
           onkeydown="if(event.key==='Enter'||event.key===' ')openArticleDetail('${escAttr(a.cartId)}')">
        <div class="productInfoV58">
          <div class="productImageWrapV58">${img}</div>
          <div class="productTextV58">
            <div class="productname">${esc(a.name)}</div>
            ${a.formato?`<small class="productFormatV58">${esc(a.formato)}</small>`:""}
            ${a.codigo?`<small class="productCodeV58">Código · ${esc(a.codigo)}</small>`:""}
            ${a.categoria?`<small class="productCategoryV74">${esc(a.categoria)}</small>`:""}
          </div>
        </div>
        <div class="qty qtyV58">
          <button type="button" aria-label="Restar"
            onclick="event.stopPropagation();changeQty('${escAttr(a.cartId)}',-1)">−</button>
          <div class="num" id="q-${slug(a.cartId)}">${cart[a.cartId]||0}</div>
          <button type="button" aria-label="Añadir"
            onclick="event.stopPropagation();changeQty('${escAttr(a.cartId)}',1)">+</button>
        </div>
      </div>
    `;
  }).join("");

  container.innerHTML=`
    <div class="providerArticlesInnerV88">
      ${rows || `<div class="categoryEmptyV57">No hay artículos que coincidan con tu búsqueda.</div>`}
    </div>
  `;

  const scroll=document.getElementById("providerArticlesScrollV88");
  if(scroll && window.__v88KeepScroll!==false){
    /* No alteramos la posición al escribir/buscar. */
  }
  v88RefreshSelected();
}

function renderProviderArticles(filter="", focusInput=true){
  if(!current) return;

  productFilter=String(filter||"");
  const source=getProviderArticles(current.id);

  const filteredSource=currentCategory
    ? source.filter(a=>(normalizarCategoria(a.categoria)||"Otros")===normalizarCategoria(currentCategory))
    : source;

  const filtered=filteredSource.filter(a=>articuloCoincide(a,productFilter));
  const list=[...filtered].sort((a,b)=>
    a.name.localeCompare(b.name,"es",{sensitivity:"base"})
  );

  const categoryBox=document.getElementById("providerCategoryList");
  const headerBox=document.getElementById("categoryHeaderV57");
  if(categoryBox) categoryBox.style.display="none";
  if(headerBox) headerBox.style.display="none";

  v88RenderControls();
  v88RenderArticleRows(list,filteredSource,productFilter);

  const input=document.getElementById("providerArticleSearchV88");
  if(input && focusInput && document.activeElement!==input){
    input.focus({preventScroll:true});
  }
}

function openProviderCategory(category){
  if(!current) return;
  currentCategory=normalizarCategoria(category);
  productFilter="";
  v88RenderControls();
  renderProviderArticles("",false);
}

function volverACategoriasProveedor(){
  currentCategory="";
  productFilter="";
  v88RenderControls();
  renderProviderArticles("",false);
}

function openProvider(id,filter=""){
  const targetId=String(id);
  const target=providers.find(p=>String(p.id)===targetId);
  if(!target){
    toast("Proveedor no encontrado");
    return;
  }

  const changingProvider=!current || String(current.id)!==targetId;
  const previousCartHasItems=Object.values(cart||{}).some(q=>Number(q)>0);

  if(changingProvider && previousCartHasItems){
    try{
      if(typeof window.guardarBorradorPedidoV22==="function") window.guardarBorradorPedidoV22();
    }catch(e){}
  }

  if(changingProvider){
    cart={};
    window.pedidoOrigenActualV21="";
  }

  current=target;
  cartProviderId=targetId;
  productFilter=filter||"";
  currentCategory="";

  const draft=typeof window.obtenerBorradorProveedorV22==="function"
    ? window.obtenerBorradorProveedorV22(target.id)
    : null;

  if(draft && draft.cart && typeof draft.cart==="object"){
    cart={...draft.cart};
    window.pedidoOrigenActualV21=draft.pedidoOrigenId||"";
  }else{
    cart={};
    window.pedidoOrigenActualV21="";
  }

  const total=getProviderArticles(current.id).length;
  const selected=v88SelectedTotal();

  $("content").innerHTML=`
    <section class="providerPageV58">
      <div class="providerNavV57 providerNavV81">
        <button id="providerNavBackV57" type="button" class="providerBackV57"
          onclick="renderHome()" aria-label="Volver a proveedores" title="Volver a proveedores">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <div class="providerNavIdentityV81">
          <span>PROVEEDOR</span>
          <strong id="providerNavTitleV57">${esc(current.name)}</strong>
        </div>

        <div class="providerNavRightV88">
          <div class="providerNavMetaV81">
            ${total} artículo${total===1?"":"s"}
          </div>
          <div id="providerSelectedV88" class="providerSelectedV88">
            ${selected} seleccionados
          </div>
        </div>
      </div>

      <div class="providerShellV58">
        <div id="providerControlsV88" class="providerControlsV88"></div>

        <div id="providerArticlesScrollV88" class="providerArticlesScrollV88">
          <div id="providerArticleList"></div>
        </div>
      </div>
    </section>
  `;

  $("bottom").style.display="block";
  renderProviderArticles(productFilter,false);
  updateCart();
}

/* Actualiza el contador verde sin reconstruir la pantalla. */
const v88OriginalChangeQty = window.changeQty;
window.changeQty = function(id,delta){
  v88OriginalChangeQty(id,delta);
  v88RefreshSelected();
};
</script>

/* Apertura del proveedor: una sola cabecera, sin duplicados. */
function openProvider(id,filter=""){
  const target=providers.find(p=>String(p.id)===String(id));

  if(!target){
    toast("Proveedor no encontrado");
    return;
  }

  const previousProviderId=String(cartProviderId||"");
  const changingProvider=
    !!previousProviderId &&
    previousProviderId!==String(target.id);

  const previousCartHasItems=
    Object.values(cart||{}).some(q=>Number(q)>0);

  if(changingProvider && previousCartHasItems){
    try{
      if(typeof window.guardarBorradorPedidoV22==="function"){
        window.guardarBorradorPedidoV22();
      }
    }catch(e){}
  }

  if(changingProvider){
    cart={};
    window.pedidoOrigenActualV21="";
  }

  current=target;
  cartProviderId=String(target.id);
  productFilter=String(filter||"");
  currentCategory="";

  const draft=
    typeof window.obtenerBorradorProveedorV22==="function"
    ? window.obtenerBorradorProveedorV22(target.id)
    : null;

  if(draft && draft.cart && typeof draft.cart==="object"){
    cart={...draft.cart};
    window.pedidoOrigenActualV21=draft.pedidoOrigenId||"";
  }else{
    cart={};
    window.pedidoOrigenActualV21="";
  }

  const total=v88ProviderSource().length;
  const selected=v88SelectedTotal();

  document.body.classList.add("providerModeV88");

  $("content").innerHTML=`
    <section class="providerPageV58">

      <div class="providerNavV57 providerNavV81">

        <button type="button"
          id="providerNavBackV57"
          class="providerBackV57"
          onclick="renderHome()"
          aria-label="Volver a proveedores"
          title="Volver a proveedores">

          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-linecap="round"
               stroke-linejoin="round"
               aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>

        </button>

        <div class="providerNavIdentityV81">
          <span>PROVEEDOR</span>
          <strong id="providerNavTitleV57">
            ${esc(current.name)}
          </strong>
        </div>

        <div class="providerNavRightV88">

          <div class="providerNavMetaV81">
            ${total} artículo${total===1?"":"s"} disponibles
          </div>

          <button type="button"
            class="providerCartV88"
            onclick="renderOrder()"
            aria-label="Ver pedido">

            <svg class="v88CartIcon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
              <circle cx="9" cy="20" r="1"/>
              <circle cx="18" cy="20" r="1"/>
              <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"/>
            </svg>

            <span>Ver pedido</span>

            <span id="providerCartCountV88"
                  class="providerCartCountV88">
              ${selected} uds.
            </span>

          </button>

        </div>
      </div>

      <div class="providerShellV58">

        <div id="providerControlsV88"
             class="providerControlsV88"></div>

        <div id="providerArticlesScrollV88"
             class="providerArticlesScrollV88">

          <div id="providerArticleList"></div>

        </div>

      </div>

    </section>
  `;

  $("bottom").style.display="none";

  v88BuildControls();
  v88RenderArticleRowsOnly();
  updateCart();
  v88UpdateCartButton();

  const scroller=
    document.getElementById("providerArticlesScrollV88");

  if(scroller) scroller.scrollTop=0;
}

/* Al salir del proveedor quitamos su modo de layout. */
const v88HomePrevious=window.renderHome;

window.renderHome=function(filter=""){
  document.body.classList.remove("providerModeV88");

  if(typeof v88HomePrevious==="function"){

};

window.changeQty=function(id,delta){

};

<script id="economato-v91-order-js">
/* ============================================================
   V91 — RESUMEN DEL PEDIDO
   ============================================================ */
function openSummary(){
  if(!current || !Object.keys(cart||{}).length){
    toast("Añade al menos un artículo");
    return;
  }

  const rows=selectedRows();
  if(!rows.length){
    toast("El pedido está vacío");
    return;
  }

  const totalUnits=rows.reduce((sum,x)=>sum+(Number(x.q)||0),0);

  $("sheet").innerHTML=`
    <div class="v91SummaryWrap">

      <div class="v91SummaryTop">

        <button type="button"
          class="v91Back"
          onclick="closeModal()"
          aria-label="Volver al proveedor">
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
          <span>Atrás</span>
        </button>

        <div class="v91Heading">
          <div class="v91Eyebrow">Resumen del pedido</div>
          <h2>HOTEL YARAMAR</h2>
          <div class="v91Supplier">
            Proveedor:
            <strong>${esc(current.name)}</strong>
          </div>
        </div>

        <div class="v91Totals">
          <svg class="v91TotalsCart"
               viewBox="0 0 24 24">
            <circle cx="9" cy="20" r="1"/>
            <circle cx="18" cy="20" r="1"/>
            <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"/>
          </svg>
          <span>${rows.length} producto${rows.length===1?"":"s"}</span>
          <span>·</span>
          <span class="units">${totalUnits} uds.</span>
        </div>

      </div>

      <div class="v91Products">

        <div class="v91ProductsHead">
          <span>Producto</span>
          <span>Unidades</span>
        </div>

        ${rows.map(x=>`
          <div class="v91ProductRow">

            <div class="v91Product">
              <span class="v91Letter">
                ${esc((x.a.name||"?").charAt(0).toUpperCase())}
              </span>

              <div>
                <div class="v91ProductName">
                  ${esc(x.a.name)}
                </div>
                ${x.a.formato
                  ? `<small class="v91Format">${esc(x.a.formato)}</small>`
                  : ""}
              </div>
            </div>

            <strong class="v91Qty">
              ${Number(x.q)||0}
            </strong>

          </div>
        `).join("")}

      </div>

      <div class="v91Actions">

        <button type="button"
          class="v91Action v91ActionReset"
          onclick="restablecerPedidoV80()">
          <svg viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 3-6.7"/>
            <path d="M3 4v6h6"/>
          </svg>
          <span>Restablecer pedido</span>
        </button>

        <button type="button"
          class="v91Action v91ActionSend"
          onclick="sendOrder()">
          <svg viewBox="0 0 24 24">
            <path d="M22 2 11 13"/>
            <path d="m22 2-7 20-4-9Z"/>
          </svg>
          <span>Enviar pedido</span>
        </button>

      </div>

    </div>
  `;

  $("modal").classList.add("show");
}
</script>
