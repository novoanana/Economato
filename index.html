:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e7ebf2;--accent:#5b5ce2;--accent2:#7c3aed;--green:#16a34a;--red:#dc2626;--shadow:0 10px 30px rgba(20,30,55,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#eef2ff 0,#f7f9fc 38%,#f4f7fb 100%);color:var(--text)}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:96px}
header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 22px #5b5ce233;border:1px solid var(--line)}.logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.headerbuttons{display:flex;gap:8px}.iconbtn{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:19px}
.status{margin:8px 18px;padding:9px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--muted)}.status.ok{color:#166534;background:#f0fdf4}.status.err{color:#991b1b;background:#fef2f2}

.section{padding:0 18px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.sectiontitle h2{font-size:15px;margin:0}.sectiontitle small{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.provider{background:#fff;border:1px solid var(--line);border-radius:19px;padding:16px;min-height:130px;text-align:left;box-shadow:var(--shadow);transition:.15s}.provider:active{transform:scale(.98)}.provider .badge{width:42px;height:42px;border-radius:13px;background:#eef0ff;color:var(--accent);display:grid;place-items:center;font-weight:900;margin-bottom:13px}.provider strong{display:block;font-size:16px}.provider small{display:block;color:var(--muted);margin-top:5px}
.back{display:flex;align-items:center;gap:8px;margin:8px 18px 14px}.back button{background:transparent;color:var(--accent);font-weight:800}.hero{margin:0 18px 16px;background:linear-gradient(135deg,#171d36,#323a72);color:#fff;border-radius:22px;padding:20px;box-shadow:0 14px 35px #20264b2e}.hero h2{margin:0 0 5px;font-size:22px}.hero p{margin:0;color:#cfd5ff;font-size:13px}
.product{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 12px;margin-bottom:9px;box-shadow:0 6px 20px rgba(20,30,55,.05)}.productname{font-weight:700;font-size:14px;line-height:1.25}.qty{display:flex;align-items:center;gap:8px;flex-shrink:0}.qty button{width:35px;height:35px;border-radius:11px;background:#eef0ff;color:var(--accent);font-size:20px;font-weight:800}.qty .num{min-width:25px;text-align:center;font-weight:800}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#ffffffeb;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:4}.cartbtn{width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900;display:flex;justify-content:space-between;box-shadow:0 12px 24px #5b5ce233}
.modal{position:fixed;inset:0;background:#0b1020aa;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{background:#fff;width:min(620px,100%);border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheet h2{margin:0 0 4px}.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.summaryBrand{display:flex;align-items:center;gap:10px;margin:4px 0 14px}.summaryLogo{width:58px;height:58px;border-radius:15px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 18px #5b5ce233;border:1px solid var(--line)}.summaryLogo img{width:100%;height:100%;object-fit:contain;padding:4px}.summaryBrand strong{display:block;font-size:16px}.summaryBrand small{display:block;color:var(--muted);margin-top:2px}.messagePreview{background:#f8fafc;border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:15px;font-size:13px;line-height:1.45;white-space:pre-line}.summary{border:1px solid var(--line);border-radius:17px;padding:8px 14px;margin-bottom:15px}.sumrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:15px}.sumrow:last-child{border-bottom:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{padding:15px;border-radius:15px;font-weight:900}.wa{background:#dcfce7;color:#15803d}.mail{background:#eef2ff;color:#4338ca}.secondary{background:#f1f5f9;color:#334155;margin-top:10px;width:100%;padding:14px;border-radius:15px;font-weight:800}
.form{display:grid;gap:11px}.form label{font-size:12px;font-weight:800;color:#475569}.form input,.form select,.form textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none}.form textarea{min-height:80px;resize:vertical}.colorPicker{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:7px}.colorSwatch{width:100%;aspect-ratio:1;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1;cursor:pointer;min-height:30px}.colorSwatch.selected{box-shadow:0 0 0 2px #111,0 0 0 4px #fff}.colorCustom{display:flex;align-items:center;gap:10px;margin-top:9px}.colorCustom input{width:48px;height:38px;padding:2px}.colorHint{font-size:11px;color:var(--muted);margin-top:5px}.primary{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900}.danger{width:100%;padding:13px;border-radius:14px;background:#fee2e2;color:#b91c1c;font-weight:900;margin-top:8px}
.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.adminCard{padding:16px;border-radius:17px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);text-align:left}.adminCard strong{display:block}.adminCard small{display:block;color:var(--muted);margin-top:4px}
.listitem{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:10px}.listitem strong{display:block}.listitem small{display:block;color:var(--muted);margin-top:4px}.listbuttons{display:flex;gap:6px;flex-shrink:0}.mini{padding:9px 10px;border-radius:10px;background:#eef0ff;color:var(--accent);font-weight:800}.mini.red{background:#fee2e2;color:#b91c1c}
.history{margin-top:18px}.order{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px}.orderhead{display:flex;justify-content:space-between;gap:8px}.order small{color:var(--muted)}.repeat{margin-top:10px;padding:9px 12px;border-radius:10px;background:#eef0ff;color:var(--accent);font-weight:800}
.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;font-size:13px;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

async function apiGet(action){
  const r=await fetch(API_URL+"?accion="+encodeURIComponent(action)+"&t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("Error HTTP "+r.status);
  const d=await r.json();
  if(!d.ok) throw new Error(d.error||"Error en API");
  return d.datos||[];
}
async function apiPost(payload){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error("Error HTTP "+r.status);
  const d=await r.json();
  if(!d.ok) throw new Error(d.error||"Error en API");
  return d;
}
function first(o,keys){for(const k of keys){if(o && o[k]!==undefined && o[k]!==null && String(o[k]).trim()!=="") return o[k]}return ""}
function normProvider(p){
  const whatsappField=String(first(p,["WHATSAPP","whatsapp"])).trim();
  const emailField=String(first(p,["EMAIL","email"])).trim();
  const legacyContact=String(first(p,["CONTACTO","contacto"])).trim();
  const canal=String(first(p,["CANAL","canal"])).toLowerCase();

  // Compatibilidad total con proveedores antiguos:
  // - Si WHATSAPP/EMAIL ya existen, tienen prioridad.
  // - Si están vacíos, recuperamos el dato de CONTACTO.
  // - Si CONTACTO contiene @, lo tratamos como email.
  // - Si es un teléfono, lo tratamos como WhatsApp.
  let whatsapp=whatsappField;
  let email=emailField;

  if(!whatsapp && !email && legacyContact){
    if(legacyContact.includes("@")){
      email=legacyContact;
    }else{
      whatsapp=legacyContact;
    }
  }else{
    if(!whatsapp && (canal==="whatsapp" || canal==="ambos") && legacyContact && !legacyContact.includes("@")){
      whatsapp=legacyContact;
    }
    if(!email && (canal==="email" || canal==="ambos") && legacyContact && legacyContact.includes("@")){
      email=legacyContact;
    }
  }

  return {
    id:first(p,["ID","id"]),
    name:String(first(p,["NOMBRE","nombre"])),
    whatsapp,
    email,
    emailCopia:String(first(p,["EMAIL_COPIA","email_copia"])),
    active:String(first(p,["ACTIVO","activo"])).toLowerCase()!=="false"
  };
}
function makeAutoArticleId(index,article){
  const raw=[article.providerId||"SIN-PROV",article.name||"SIN-NOMBRE",article.codigo||"",index].join("|");
  let h=0;
  for(let i=0;i<raw.length;i++) h=((h<<5)-h)+raw.charCodeAt(i)|0;
  return "AUTO-ART-"+Math.abs(h).toString(36).toUpperCase()+"-"+index;
}
function normArticle(a,index){
  return {
    id:first(a,["ID","id"]),
    providerId:first(a,["PROVEEDOR_ID","proveedor_id"]),
    name:String(first(a,["NOMBRE","nombre"])),
    codigo:String(first(a,["CODIGO","codigo"])),
    formato:String(first(a,["FORMATO","formato"])),
    unidad:String(first(a,["UNIDAD","unidad"])),
    observaciones:String(first(a,["OBSERVACIONES","observaciones"])),
    colorNombre:String(first(a,["COLOR_NOMBRE","color_nombre"])) || "#000000",
    active:String(first(a,["ACTIVO","activo"])).toLowerCase()!=="false",
    rowIndex:index
  };
}
function asignarClavesArticulos(lista){
  const usados=new Set();
  return lista.map((a,index)=>{
    const original=String(a.id||"").trim();
    let clave=original;
    let auto=false;
    if(!clave || usados.has(clave)){
      clave=makeAutoArticleId(index,a);
      auto=true;
      let n=1;
      while(usados.has(clave)) clave=makeAutoArticleId(index,a)+"-"+(n++);
    }
    usados.add(clave);
    return {...a,cartId:clave,idOriginal:original,autoId:auto};
  });
}

async function entrarTemporal(usuario){
  const u=TEMP_USERS[usuario];
  if(!u){toast("Usuario no válido");return}
  try{
    $("status").textContent="● Comprobando hotel…";
    $("status").className="status";
    const r=await apiPost({accion:"obtener_contexto_hotel",hotelId:u.hotelId});
    if(!r.ok) throw new Error(r.error||"Hotel no disponible");
    session={...u,token:"",usuarioId:usuario==="novoa"?"USR-001":"USR-002"};
    guardarSesionLocal();
    actualizarCabecera();
    await cargarDatos();
    renderHome();
    toast("Acceso correcto · "+session.hotelNombre);
  }catch(e){setError(e)}
}
function cerrarSesionApp(){
  limpiarSesionLocal();
  providers=[]; articles=[]; articlesByProvider=new Map(); current=null; cart={};
  actualizarCabecera();
  renderLogin();
  $("status").textContent="● Sesión cerrada";
  $("status").className="status";
}
async function cargarDatos(){
  if(!session.hotelId) throw new Error("No hay un hotel seleccionado en la sesión");

  const [pr,ar]=await Promise.all([
    apiPost({accion:"obtener_proveedores_hotel",hotelId:session.hotelId}),
    apiPost({accion:"obtener_articulos_hotel",hotelId:session.hotelId})
  ]);

  const p=pr.proveedores||[];
  const a=ar.articulos||[];

  providers=p
    .map(normProvider)
    .filter(x=>x.active)
    .sort((a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"}));

  articles=asignarClavesArticulos(
    a.map((x,i)=>normArticle(x,i)).filter(x=>x.active)
  );

  articles.sort((a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"}));

  // Índice en memoria: evita hacer articles.filter(...) repetidamente.
  articlesByProvider=new Map();

  for(const articulo of articles){
    const key=String(articulo.providerId);
    if(!articlesByProvider.has(key)) articlesByProvider.set(key,[]);
    articlesByProvider.get(key).push(articulo);
  }

  $("status").textContent="● Conectado · datos de Google Sheets";
  $("status").className="status ok";
}

async function recargarDatos(){
  try{
    $("status").textContent="● Actualizando datos…";
    $("status").className="status";
    await cargarDatos();

    if(current){
      openProvider(current.id,productFilter);
    }else{
      renderHome(homeFilter);
    }

    toast("Datos actualizados");
  }catch(e){
    setError(e);
  }
}

function setError(e){
  $("status").textContent="● Error de conexión: "+e.message;
  $("status").className="status err";
}

function normalizarTextoBusqueda(valor){
  return String(valor||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}

function articuloCoincide(a,filter){
  const q=normalizarTextoBusqueda(filter);
  if(!q) return true;

  const texto=[
    a.name,
    a.codigo,
    a.formato,
    a.unidad,
    a.observaciones
  ].map(normalizarTextoBusqueda).join(" ");

  return texto.includes(q);
}

function getProviderArticles(providerId){
  return articlesByProvider.get(String(providerId))||[];
}

function renderGlobalArticleResults(filter=""){
  const box=$("globalArticleResults");
  if(!box) return;

  const q=String(filter||"").trim();

  if(!q){
    box.innerHTML="";
    return;
  }

  const matches=articles.filter(a=>articuloCoincide(a,q));

  box.innerHTML=matches.length
    ? matches.map(a=>{
        const p=providers.find(x=>String(x.id)===String(a.providerId));
        return `<button class="articleResult" type="button" onclick="openArticleDetail('${escAttr(a.cartId)}')">
          <div class="articleResultMain">
            <div class="articleResultName" style="color:${/^#[0-9A-Fa-f]{6}$/.test(a.colorNombre)?a.colorNombre:'#000000'}">${esc(a.name)}</div>
            <span class="articleResultMeta">${p?esc(p.name):"Sin proveedor"}${a.formato?" · "+esc(a.formato):""}${a.codigo?" · Código "+esc(a.codigo):""}</span>
          </div>
          <span class="articleResultArrow">›</span>
        </button>`;
      }).join("")
    : `<div class="empty">No se encontraron artículos.</div>`;

}

function saveLocalOrder(channel,rows){
  const history=JSON.parse(localStorage.getItem("economato_orders")||"[]");
  history.unshift({
    id:Date.now(),
    date:new Date().toLocaleString("es-ES"),
    provider:current.name,
    items:Object.fromEntries(rows.map(x=>[x.a.name,x.q])),
    channel
  });
  localStorage.setItem("economato_orders",JSON.stringify(history.slice(0,100)));
}

async function sendOrder(channel){
  const rows=selectedRows();
  const text=buildOrderText();

  if(!rows.length){
    toast("El pedido está vacío");
    return;
  }

  saveLocalOrder(channel,rows);

  if(channel==="whatsapp"){
    const digits=String(current.whatsapp||"").replace(/\D/g,"").replace(/^34/,"");
    if(!digits){
      toast("Este proveedor no tiene WhatsApp configurado");
      return;
    }

    // Abrimos WhatsApp ANTES de esperar a Google Apps Script.
    // Así el navegador no bloquea la ventana por una petición asíncrona.
    const waUrl="https://wa.me/34"+digits+"?text="+encodeURIComponent(text);
    const waWindow=window.open(waUrl,"_blank");

    // Guardamos el pedido en segundo plano.
    apiPost({
      accion:"crear_pedido",
      proveedor_id:current.id,
      proveedor_nombre:current.name,
      canal:"whatsapp",
      destinatario:current.whatsapp,
      lineas:rows.map(x=>({articulo_id:x.a.idOriginal||x.a.cartId,articulo_nombre:x.a.name,cantidad:x.q}))
    }).catch(e=>console.error("No se pudo guardar el pedido:",e));

    if(!waWindow){
      window.location.href=waUrl;
    }
    toast("WhatsApp preparado");
    cart={};
    updateCart();
    closeModal();
    return;
  }

  if(channel==="email"){
    if(!current.email){
      toast("Este proveedor no tiene email configurado");
      return;
    }

    toast("Enviando email…");

    try{
      await apiPost({
        accion:"crear_pedido",
        proveedor_id:current.id,
        proveedor_nombre:current.name,
        canal:"email",
        destinatario:current.email,
        lineas:rows.map(x=>({articulo_id:x.a.idOriginal||x.a.cartId,articulo_nombre:x.a.name,cantidad:x.q}))
      });

      await apiPost({
        accion:"enviar_email_pedido",
        email:current.email,
        email_copia:current.emailCopia||"",
        proveedor:current.name,
        items:rows.map(x=>({nombre:x.a.name,cantidad:x.q})),
        mensaje:text
      });

      toast("Email enviado correctamente");
    }catch(e){
      console.error(e);

      // Si el envío HTML del servidor falla, abrimos el correo del usuario
      // como respaldo, sin perder el pedido.
      const cc=current.emailCopia?`&cc=${encodeURIComponent(current.emailCopia)}`:"";
      const mailto="mailto:"+encodeURIComponent(current.email)+
        "?subject="+encodeURIComponent("Pedido "+current.name)+
        "&body="+encodeURIComponent(text)+cc;
      window.location.href=mailto;
      toast("Se abrió el correo como respaldo");
    }

    cart={};
    updateCart();
    closeModal();
  }
}

function normalizarColorArticulo(color){
  let c=String(color||"").trim().toLowerCase();

  // Google Sheets normalmente devuelve colores en formato #rrggbb.
  // Normalizamos también el formato corto para que #f00 y #ff0000
  // se consideren el mismo grupo.
  if(/^#[0-9a-f]{3}$/.test(c)){
    c="#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  }

  // Si no hay color válido, lo tratamos como negro.
  if(!/^#[0-9a-f]{6}$/.test(c)){
    c="#000000";
  }

  return c;
}

function ordenarArticulosPorColorYNombre(lista){
  /*
   * V14: agrupación DINÁMICA por cualquier color.
   *
   * No existe una lista fija de colores.
   * El primer color que aparece ocupa el primer grupo,
   * el segundo color ocupa el segundo grupo, etc.
   * Dentro de cada grupo se ordena alfabéticamente.
   *
   * Ejemplo:
   * rojo, negro, verde, rojo, verde, negro
   *
   * Resultado:
   * rojo    -> alfabético
   * negro   -> alfabético
   * verde   -> alfabético
   *
   * Si mañana aparece azul, amarillo o cualquier otro color,
   * se crea automáticamente otro grupo sin tocar el código.
   */
  const copia=[...lista];
  const ordenGrupos=new Map();
  let siguienteGrupo=0;

  for(const articulo of copia){
    const color=normalizarColorArticulo(articulo?.colorNombre);
    if(!ordenGrupos.has(color)){
      ordenGrupos.set(color,siguienteGrupo++);
    }
  }

  return copia.sort((a,b)=>{
    const colorA=normalizarColorArticulo(a?.colorNombre);
    const colorB=normalizarColorArticulo(b?.colorNombre);

    const grupoA=ordenGrupos.get(colorA);
    const grupoB=ordenGrupos.get(colorB);

    if(grupoA!==grupoB){
      return grupoA-grupoB;
    }

    const nombreA=String(a?.name||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase();

    const nombreB=String(b?.name||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase();

    return nombreA.localeCompare(
      nombreB,
      "es",
      {sensitivity:"base"}
    );
  });
}

function showHistory(){
  const h=JSON.parse(localStorage.getItem("economato_orders")||"[]");
  $("sheet").innerHTML=`<h2>Historial de pedidos</h2><div class="sub">Pedidos realizados desde este dispositivo.</div><div class="history">${h.length?h.map(o=>`<div class="order"><div class="orderhead"><strong>${esc(o.provider)}</strong><small>${esc(o.date)}</small></div><small>${Object.values(o.items).reduce((a,b)=>a+b,0)} unidades · ${esc(o.channel)}</small></div>`).join(""):`<div class="empty">Todavía no hay pedidos.</div>`}</div><button class="secondary" onclick="closeModal()">Cerrar</button>`;
  $("modal").classList.add("show");
}
function closeModal(){$("modal").classList.remove("show")}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function slug(s){try{return btoa(unescape(encodeURIComponent(String(s)))).replace(/[^a-zA-Z0-9]/g,"").slice(0,30)}catch(e){return String(s).replace(/\W/g,"").slice(0,30)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return esc(s).replace(/`/g,"&#96;")}
function toast(t){const x=$("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2800)}
async function start(){
  actualizarCabecera();
  if(!cargarSesionLocal()){
    renderLogin();
    $("status").textContent="● Selecciona tu usuario";
    $("status").className="status";
    return;
  }
  try{
    await cargarDatos();
    renderHome();
  }catch(e){
    limpiarSesionLocal();
    renderLogin();
    setError(e);
  }
}
start();
</script>

<script>
(function(){
  const DRAFT_KEY="ECONOMATO_PEDIDO_BORRADOR_V20";
  function saveDraft(){
    try{
      if(!Array.isArray(cart)) return;
      const ids=Object.keys(cart);
      if(!ids.length){ localStorage.removeItem(DRAFT_KEY); return; }
      localStorage.setItem(DRAFT_KEY,JSON.stringify({
        version:20,
        savedAt:new Date().toISOString(),
        hotelId:session?.hotelId||"",
        providerId:current?.id||"",
        providerName:current?.name||"",
        cart:cart
      }));
    }catch(e){console.warn("No se pudo guardar el borrador",e)}
  }
  function clearDraft(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}
  window.guardarBorradorPedidoV20=saveDraft;
  window.borrarBorradorPedidoV20=clearDraft;
  window.obtenerBorradorPedidoV20=function(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY)||"null")}catch(e){return null}};
  setInterval(saveDraft,3000);
  window.addEventListener("beforeunload",saveDraft);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveDraft()});
  window.addEventListener("load",()=>setTimeout(()=>{
    try{
      const d=window.obtenerBorradorPedidoV20();
      if(!d||!Array.isArray(d.cart)||!d.cart.length)return;
      if(session?.hotelId&&d.hotelId&&String(session.hotelId)!==String(d.hotelId))return;
      const age=Date.now()-new Date(d.savedAt).getTime();
      if(!Number.isFinite(age)||age>7*24*60*60*1000){clearDraft();return;}
      if(Array.isArray(cart)&&Object.keys(cart).length===0){
        cart={...d.cart};
        updateCart();
        if(typeof Swal!=="undefined") Swal.fire({icon:"info",title:"Pedido recuperado",text:"Hemos recuperado el pedido que estabas preparando.",confirmButtonText:"Continuar"});
      }
    }catch(e){console.warn("No se pudo recuperar el borrador",e)}
  },1200));
})();
</script>
