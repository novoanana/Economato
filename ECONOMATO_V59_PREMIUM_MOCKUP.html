/* V30 — ICONOS DE BÚSQUEDA LIMPIOS, IGUALES AL LENGUAJE VISUAL SUPERIOR */

.searchToolsV29{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin:10px 0 18px;
  width:100%;
}

.searchToggleV29{
  width:48px;
  height:48px;
  min-width:48px;
  padding:0;
  border:0;
  background:transparent;
  border-radius:50%;
  color:#20233f;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:transform .18s ease, color .18s ease, filter .18s ease;
  box-shadow:none;
}

.searchToggleV29:hover{
  transform:translateY(-2px) scale(1.04);
  color:#4f4bd4;
}

.searchToggleV29:active{
  transform:scale(.92);
}

.searchToggleV29.active{
  color:#5b58d2;
  background:transparent;
  box-shadow:none;
}

.searchToggleV29::after{
  content:attr(aria-label);
  position:absolute;
  top:calc(100% + 7px);
  left:50%;
  transform:translate(-50%,-3px);
  background:#252946;
  color:#fff;
  padding:5px 8px;
  border-radius:7px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease,transform .15s ease;
  z-index:30;
}

.searchToggleV29:hover::after{
  opacity:1;
  transform:translate(-50%,0);
}

.modernSearchIconV29{
  width:30px;
  height:30px;
  display:block;
}

.modernCanIconV29{
  width:30px;
  height:30px;
  display:block;
  filter:drop-shadow(0 1px 1px rgba(40,44,80,.12));
}

.searchModalV29{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:78px 18px 24px;
  background:rgba(20,24,45,.42);
  backdrop-filter:blur(7px);
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}

.searchModalV29.open{
  opacity:1;
  pointer-events:auto;
}

.searchModalCardV29{
  width:min(560px,100%);
  background:#fff;
  border-radius:24px;
  box-shadow:0 24px 70px rgba(20,24,45,.24);
  padding:18px;
  transform:translateY(-12px) scale(.98);
  transition:transform .25s ease;
}

.searchModalV29.open .searchModalCardV29{
  transform:translateY(0) scale(1);
}

.searchModalHeadV29{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.searchModalTitleV29{
  font-size:18px;
  font-weight:900;
  color:#20233f;
  display:flex;
  align-items:center;
  gap:8px;
}

.searchModalCloseV29{
  width:36px;
  height:36px;
  border:0;
  border-radius:12px;
  background:#f2f3f8;
  color:#555b76;
  font-size:22px;
  cursor:pointer;
  transition:transform .18s ease,background .18s ease;
}

.searchModalCloseV29:hover{
  transform:scale(1.05);
  background:#e9eaf2;
}

.searchModalCardV29 .search{margin:0;}
.searchModalCardV29 .search input{font-size:16px;}

.searchResultsV29{
  margin-top:12px;
  display:grid;
  gap:8px;
  max-height:390px;
  overflow:auto;
}

.providerSearchResultV29,
.articleSearchResultV29{
  width:100%;
  border:1px solid #e8e9f2;
  background:#fff;
  border-radius:15px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
  cursor:pointer;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}

.providerSearchResultV29:hover,
.articleSearchResultV29:hover{
  transform:translateY(-1px);
  border-color:#d9daf0;
  box-shadow:0 7px 18px rgba(40,44,80,.08);
}

.providerSearchResultMainV29 strong,
.articleSearchResultMainV29 strong{
  display:block;
  font-size:14px;
  color:#20233f;
}

.providerSearchResultMainV29 small,
.articleSearchResultMainV29 small{
  display:block;
  margin-top:3px;
  color:#7b7f96;
  font-size:12px;
}

.searchResultArrowV29{
  font-size:24px;
  color:#5b58d2;
  line-height:1;
}

@media (max-width:520px){
  .searchToggleV29{
    width:50px;
    height:50px;
    flex-basis:50px;
    border-radius:15px;
  }
}

async function apiGet(action){
  const r=await fetch(API_URL+"?accion="+encodeURIComponent(action)+"&t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("Error HTTP "+r.status);
  const d=await r.json();
  if(!d.ok) throw new Error(d.error||"Error en API");
  return d.datos||[];
}
async function apiPost(payload){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error("Error HTTP "+r.status);
  const d=await r.json();
  if(!d.ok) throw new Error(d.error||"Error en API");
  return d;
}
function first(o,keys){for(const k of keys){if(o && o[k]!==undefined && o[k]!==null && String(o[k]).trim()!=="") return o[k]}return ""}
function normalizarTextoBusquedaSeguro(valor){
  return String(valor||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}
function normProvider(p){
  const whatsappField=String(first(p,["WHATSAPP","whatsapp"])).trim();
  const emailField=String(first(p,["EMAIL","email"])).trim();
  const legacyContact=String(first(p,["CONTACTO","contacto"])).trim();
  const canal=String(first(p,["CANAL","canal"])).toLowerCase();

  // Compatibilidad total con proveedores antiguos:
  // - Si WHATSAPP/EMAIL ya existen, tienen prioridad.
  // - Si están vacíos, recuperamos el dato de CONTACTO.
  // - Si CONTACTO contiene @, lo tratamos como email.
  // - Si es un teléfono, lo tratamos como WhatsApp.
  let whatsapp=whatsappField;
  let email=emailField;

  if(!whatsapp && !email && legacyContact){
    if(legacyContact.includes("@")){
      email=legacyContact;
    }else{
      whatsapp=legacyContact;
    }
  }else{
    if(!whatsapp && (canal==="whatsapp" || canal==="ambos") && legacyContact && !legacyContact.includes("@")){
      whatsapp=legacyContact;
    }
    if(!email && (canal==="email" || canal==="ambos") && legacyContact && legacyContact.includes("@")){
      email=legacyContact;
    }
  }

  const name=String(first(p,["NOMBRE","nombre"]));
  const image=String(first(p,["IMAGEN_URL","IMAGEN","LOGO_URL","LOGO","imagen_url","imagen","logo_url","logo"])).trim();
  return {
    id:first(p,["ID","id"]),
    name,
    searchName:normalizarTextoBusquedaSeguro(name),
    whatsapp,
    email,
    emailCopia:String(first(p,["EMAIL_COPIA","email_copia"])),
    image,
    active:String(first(p,["ACTIVO","activo"])).toLowerCase()!=="false"
  };
}
function makeAutoArticleId(index,article){
  const raw=[article.providerId||"SIN-PROV",article.name||"SIN-NOMBRE",article.codigo||"",index].join("|");
  let h=0;
  for(let i=0;i<raw.length;i++) h=((h<<5)-h)+raw.charCodeAt(i)|0;
  return "AUTO-ART-"+Math.abs(h).toString(36).toUpperCase()+"-"+index;
}
function normArticle(a,index){
  const providerId=first(a,["PROVEEDOR_ID","proveedor_id"]);
  const name=String(first(a,["NOMBRE","nombre"]));
  const codigo=String(first(a,["CODIGO","codigo"]));
  const formato=String(first(a,["FORMATO","formato"]));
  const unidad=String(first(a,["UNIDAD","unidad"]));
  const observaciones=String(first(a,["OBSERVACIONES","observaciones"]));
  const categoria=String(first(a,["CATEGORIA","categoria","CATEGORÍA","categoría"])).trim();
  const image=String(first(a,["IMAGEN_URL","IMAGEN","imagen_url","imagen"])).trim();
  return {
    id:first(a,["ID","id"]),
    providerId,
    name,
    searchText:normalizarTextoBusquedaSeguro([name,codigo,formato,unidad,observaciones,categoria].join(" ")),
    codigo,
    formato,
    unidad,
    observaciones,
    categoria,
    image,
    active:String(first(a,["ACTIVO","activo"])).toLowerCase()!=="false",
    rowIndex:index
  };
}
function asignarClavesArticulos(lista){
  const usados=new Set();
  return lista.map((a,index)=>{
    const original=String(a.id||"").trim();
    let clave=original;
    let auto=false;
    if(!clave || usados.has(clave)){
      clave=makeAutoArticleId(index,a);
      auto=true;
      let n=1;
      while(usados.has(clave)) clave=makeAutoArticleId(index,a)+"-"+(n++);
    }
    usados.add(clave);
    return {...a,cartId:clave,idOriginal:original,autoId:auto};
  });
}

function cargarSesionLocal(){
  try{
    const raw=sessionStorage.getItem("economato_session_v18");
    if(!raw) return false;
    const s=JSON.parse(raw);
    if(!s||!s.usuario||!s.hotelId) return false;
    session={...session,...s};

  }catch(e){return false}
}

function normalizarDiaCalendario(valor){
  return String(valor||"").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function fechaLocalSinHora(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function diaHoyCalendario(){const n=fechaLocalSinHora().getDay();return n===0?7:n;}
function formatoFechaHoyCalendario(){return fechaLocalSinHora().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});}
function cargarCalendarioEnMemoria(lista){
  providerCalendar=Array.isArray(lista)?lista.map(x=>({
    hotelId:String(x.hotelId||x.HOTEL_ID||""),
    providerId:String(x.proveedorId||x.PROVEEDOR_ID||""),
    diaPedido:String(x.diaPedido||x.DIA_PEDIDO||""),
    diaEntrega:String(x.diaEntrega||x.DIA_ENTREGA||""),
    activo:String(x.activo??x.ACTIVO??true).toLowerCase()!=="false"
  })).filter(x=>x.providerId&&x.activo):[];
  calendarByProvider=new Map();
  for(const item of providerCalendar){const key=String(item.providerId);if(!calendarByProvider.has(key))calendarByProvider.set(key,[]);calendarByProvider.get(key).push(item);}
}
async function cargarCalendario(){
  if(!session.hotelId){cargarCalendarioEnMemoria([]);return;}
  const r=await apiPost({accion:"obtener_calendario_proveedores",hotelId:session.hotelId});
  cargarCalendarioEnMemoria(r.calendario||[]);
}
function getProviderCalendarInfo(providerId){
  const rows=calendarByProvider.get(String(providerId))||[];
  if(!rows.length)return {today:false,delivery:"",nextDay:"",nextDelivery:"",hasCalendar:false};
  const today=diaHoyCalendario(),candidates=[],todayRows=[];
  for(const row of rows){
    const pedido={LUNES:1,MARTES:2,"MIERCOLES":3,JUEVES:4,VIERNES:5,SABADO:6,DOMINGO:7}[normalizarDiaCalendario(row.diaPedido)]||0;
    if(!pedido)continue;
    const delta=(pedido-today+7)%7;
    if(delta===0)todayRows.push(row);
    candidates.push({row,delta:delta===0?7:delta});
  }
  const next=candidates.sort((a,b)=>a.delta-b.delta)[0];
  return {today:todayRows.length>0,delivery:todayRows.length?String(todayRows[0].diaEntrega||"").trim():"",nextDay:next?String(next.row.diaPedido||"").trim():"",nextDelivery:next?String(next.row.diaEntrega||"").trim():"",hasCalendar:true};
}

}

/* ============================================================
   V44 — FUENTE DE VERDAD DEL ESTADO "PEDIDO REALIZADO"
   - El estado ya NO se guarda en localStorage.
   - Google Sheets / historial centralizado es la única fuente de verdad.
   - Solo se marca un proveedor si existe un pedido ENVIADO de HOY
     para el hotel + usuario de la sesión actual.
   - Si se elimina el pedido de Sheets, el ✓ desaparece al recargar.
   ============================================================ */
let v44SentTodayProviders = new Set();
let v44SentTodayLoaded = false;

function v44FechaLocalKey(valor){
  const d=valor instanceof Date?valor:new Date(valor);
  if(Number.isNaN(d.getTime()))return "";
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function v44HoyKey(){
  return v44FechaLocalKey(new Date());
}

function v42WasSentToday(providerId){
  return v44SentTodayProviders.has(String(providerId));
}

/*
 * Mantiene el nombre V42 para no romper ninguna llamada existente,
 * pero ya no escribe absolutamente nada en localStorage.
 */
function v42MarkSentToday(providerId,channel){
  v44SentTodayProviders.add(String(providerId));
}

function v42SentBadgeForProvider(providerId){
  if(!v42WasSentToday(providerId))return "";
  return `<div class="sentBadgeV42">✅ PEDIDO REALIZADO</div>`;
}

/*
 * Lee el historial real de Google Sheets.
 * El backend ya filtra por HOTEL_ID + USUARIO + ESTADO ENVIADO
 * y solo admite canales WhatsApp/Email.
 */
async function v44CargarPedidosRealizadosHoy(){

  const estadoAnterior=
    new Set(
      v44SentTodayProviders
    );

  v44SentTodayLoaded=false;

  if(
    !session.hotelId ||
    !session.usuario
  ){

    v44SentTodayLoaded=true;
    return [];

  }

  try{

    const r=
      await apiPost({
        accion:"obtener_historial_pedidos",
        hotel_id:session.hotelId,
        usuario_id:session.usuarioId,
        usuario:session.usuario
      });

    const pedidos=
      Array.isArray(r.pedidos)
        ? r.pedidos
        : [];

    const hoy=
      v44HoyKey();

    const nuevos=
      new Set();

    pedidos.forEach(
      pedido=>{

        const fecha=
          v44FechaLocalKey(
            pedido?.fecha
          );

        const proveedorId=
          String(
            pedido?.proveedor_id||""
          ).trim();

        if(
          fecha===hoy &&
          proveedorId
        ){

          nuevos.add(
            proveedorId
          );

        }

      }
    );

    v44SentTodayProviders=
      nuevos;

    v44SentTodayLoaded=true;

    return pedidos;

  }catch(e){

    console.error(
      "No se pudo sincronizar el estado de pedidos realizados:",
      e
    );

    /*
     * Una caída temporal de red no debe borrar un ✓ que acabamos
     * de confirmar localmente tras registrar el pedido.
     */
    v44SentTodayProviders=
      estadoAnterior;

    v44SentTodayLoaded=false;

    return [];

  }
}

/*
 * Tras registrar un pedido correctamente en Sheets, actualizamos
 * inmediatamente la memoria visual para que el usuario vea el ✓
 * sin tener que recargar la página.
 */
function v44MarcarPedidoRealizadoLocalmente(providerId){
  if(providerId){
    v44SentTodayProviders.add(String(providerId));
  }
}

function normalizarCategoria(valor){
  return String(valor||"").trim().replace(/\s+/g," ");
}

function obtenerCategoriasProveedor(providerId){
  const source=getProviderArticles(providerId);
  const mapa=new Map();

  for(const a of source){
    const categoria=normalizarCategoria(a.categoria) || "Otros";
    if(!mapa.has(categoria)) mapa.set(categoria,[]);
    mapa.get(categoria).push(a);
  }

  return Array.from(mapa.entries()).map(([name,items])=>({name,items}))
    .sort((a,b)=>{
      const aOtros=a.name.toLowerCase()==="otros";
      const bOtros=b.name.toLowerCase()==="otros";
      if(aOtros!==bOtros) return aOtros?1:-1;
      return a.name.localeCompare(b.name,"es",{sensitivity:"base"});
    });
}

function changeQty(id,delta){
  if(!current){
    toast("Selecciona un proveedor");
    return;
  }

  const article=articles.find(a=>String(a.cartId)===String(id));

  if(!article){
    toast("Artículo no encontrado");
    return;
  }

  /*
   * SEGUNDA BARRERA V28:
   * Un artículo solo puede entrar en el carrito si pertenece
   * al proveedor actualmente abierto.
   */
  if(String(article.providerId)!==String(current.id)){
    console.warn("Intento de añadir artículo de otro proveedor bloqueado",{
      articleId:id,
      articleProviderId:article.providerId,
      currentProviderId:current.id
    });
    toast("Este artículo pertenece a otro proveedor");
    return;
  }

  /*
   * El carrito en memoria queda ligado al proveedor actual.
   * Si por cualquier circunstancia el identificador interno
   * no coincide, empezamos limpio antes de modificarlo.
   */
  if(String(cartProviderId)!==String(current.id)){
    cart={};
    cartProviderId=String(current.id);
    window.pedidoOrigenActualV21="";
  }

  cart[id]=Math.max(0,(cart[id]||0)+delta);

  if(!cart[id])delete cart[id];

  const el=$("q-"+slug(id));
  if(el)el.textContent=cart[id]||0;

  updateCart();

  try{
    if(typeof window.guardarBorradorPedidoV22==="function"){
      window.guardarBorradorPedidoV22();
    }
  }catch(e){}
}

function formatOrderLine(x,maxLen){
  const formato=String(x?.a?.formato||"").trim();
  const base=`${x.q} ${x.a.name}`;

  if(!formato){
    return `*${base}*`;
  }

  /*
   * V55:
   * La columna del formato se calcula tomando como referencia
   * EL ARTÍCULO MÁS LARGO DEL PEDIDO.
   *
   * No calculamos el ancho de cada texto ni usamos Canvas:
   * todos parten de una misma posición lógica.
   *
   * U+00A0 = espacio no separable, para que WhatsApp conserve
   * la separación entre las dos columnas.
   */
  const faltan=Math.max(
    2,
    maxLen-base.length+4
  );

  const separacion="\u00A0".repeat(faltan);

  return `*${base}*${separacion}_${formato}_`;
}

function buildOrderText(){
  const rows=selectedRows();

  /*
   * Encontramos el artículo más largo del pedido.
   * La longitud incluye la cantidad porque también forma parte
   * de la primera columna.
   */
  const maxLen=rows.reduce((max,x)=>{
    const base=`${x.q} ${x.a.name}`;
    return Math.max(max,base.length);
  },0);

  return `Hola, soy ${session.nombre||session.usuario||""}, te mando el pedido del ${session.hotelNombre||"hotel"}:\n\n${rows.map(x=>formatOrderLine(x,maxLen)).join("\n")}\n\nGracias, un Saludo`;
}

function buildPedidoPayload(channel,rows,extra={}){
  const canal=String(channel||"").trim().toLowerCase();

  let destinatario="";

  if(canal==="whatsapp"){
    destinatario=String(current.whatsapp||"").trim();
  }else if(canal==="email"){
    destinatario=String(current.email||"").trim();
  }else if(canal==="ambos"){
    destinatario=[
      current.whatsapp?`WhatsApp: ${current.whatsapp}`:"",
      current.email?`Email: ${current.email}`:""
    ].filter(Boolean).join(" | ");
  }

  return {
    accion:"crear_pedido",
    hotel_id:session.hotelId,
    hotel_nombre:session.hotelNombre,
    usuario_id:session.usuarioId,
    usuario:session.usuario,
    proveedor_id:current.id,
    proveedor_nombre:current.name,
    canal,
    destinatario,
    pedido_origen_id:extra.pedido_origen_id||"",
    lineas:rows.map(x=>({
      articulo_id:x.a.idOriginal||x.a.cartId,
      articulo_nombre:x.a.name,
      formato:x.a.formato||"",
      cantidad:x.q
    }))
  };
}

async function registrarPedidoEnServidor(channel,rows,extra={}){

async function sendOrder(){
  const rows=selectedRows();
  const text=buildOrderText();

  if(!rows.length){
    toast("El pedido está vacío");
    return;
  }

  const hasWhatsApp=!!String(current.whatsapp||"").trim();
  const hasEmail=!!String(current.email||"").trim();

  if(!hasWhatsApp&&!hasEmail){
    toast("Este proveedor no tiene WhatsApp ni email configurado");
    return;
  }

  const canal=hasWhatsApp&&hasEmail
    ? "ambos"
    : hasWhatsApp
      ? "whatsapp"
      : "email";

  /*
   * ------------------------------------------------------------
   * WHATSAPP
   * ------------------------------------------------------------
   *
   * Si existe WhatsApp, lo abrimos primero.
   * Así el navegador no bloquea la ventana.
   *
   * IMPORTANTE:
   * Todavía NO registramos el pedido.
   * Primero completamos todos los canales disponibles.
   */

  let waWindow=null;
  let waUrl="";

  if(hasWhatsApp){
    const digits=
      String(current.whatsapp||"")
        .replace(/\D/g,"")
        .replace(/^34/,"");

    if(!digits){
      toast("El WhatsApp del proveedor no es válido");
      return;
    }

    waUrl=
      "https://wa.me/34"+
      digits+
      "?text="+
      encodeURIComponent(text);

    waWindow=
      window.open(
        waUrl,
        "_blank"
      );
  }


  /*
   * ------------------------------------------------------------
   * EMAIL
   * ------------------------------------------------------------
   *
   * Si existe email, lo enviamos desde Apps Script.
   * Si falla, mantenemos el respaldo mailto.
   */

  let emailOk=false;

  if(hasEmail){

    toast(
      hasWhatsApp
        ? "WhatsApp preparado · enviando email…"
        : "Enviando email…"
    );

    try{

      await apiPost({
        accion:"enviar_email_pedido",
        email:current.email,
        email_copia:current.emailCopia||"",
        proveedor:current.name,
        items:rows.map(x=>({
          nombre:x.a.name,
          formato:x.a.formato||"",
          cantidad:x.q
        })),
        mensaje:text
      });

      emailOk=true;

      toast(
        hasWhatsApp
          ? "WhatsApp preparado · email enviado"
          : "Email enviado correctamente"
      );

    }catch(e){

      console.error(
        "Fallo el envío de email desde Apps Script:",
        e
      );

      /*
       * Respaldo:
       * abrimos el cliente de correo del usuario.
       */
      const cc=
        current.emailCopia
          ? `&cc=${encodeURIComponent(current.emailCopia)}`
          : "";

      const mailto=
        "mailto:"+
        encodeURIComponent(current.email)+
        "?subject="+
        encodeURIComponent("Pedido "+current.name)+
        "&body="+
        encodeURIComponent(text)+
        cc;

      window.location.href=mailto;

      /*
       * Se considera canal intentado mediante el respaldo.
       * El pedido se registrará como enviado si el registro en
       * Sheets se completa correctamente.
       */
      emailOk=true;

      toast(
        hasWhatsApp
          ? "WhatsApp preparado · se abrió el correo como respaldo"
          : "Se abrió el correo como respaldo"
      );
    }
  }


  /*
   * ------------------------------------------------------------
   * WHATSAPP: FALLBACK SI EL NAVEGADOR BLOQUEÓ LA VENTANA
   * ------------------------------------------------------------
   */

  if(
    hasWhatsApp &&
    !waWindow &&
    waUrl
  ){
    window.location.href=waUrl;
  }


  /*
   * ------------------------------------------------------------
   * VALIDAR QUE LOS CANALES HAN PODIDO PREPARARSE
   * ------------------------------------------------------------
   */

  if(
    hasEmail &&
    !emailOk
  ){
    toast(
      hasWhatsApp
        ? "WhatsApp se abrió, pero el email no pudo prepararse"
        : "El email no pudo prepararse"
    );
    return;
  }


  /*
   * ------------------------------------------------------------
   * REGISTRAR UN ÚNICO PEDIDO
   * ------------------------------------------------------------
   *
   * Aunque se utilicen dos canales, aquí solo se crea UN pedido.
   */

  try{

    await registrarPedidoEnServidor(
      canal,
      rows,
      {
        pedido_origen_id:
          window.pedidoOrigenActualV21||""
      }
    );

  }catch(e){

    console.error(
      "No se pudo registrar el pedido:",
      e
    );

    toast(
      "El pedido se preparó, pero no se pudo guardar en el historial"
    );

    return;
  }


  /*
   * ------------------------------------------------------------
   * FINALIZAR
   * ------------------------------------------------------------
   */

  v44MarcarPedidoRealizadoLocalmente(
    current.id
  );

  if(canal==="ambos"){
    toast("Pedido enviado por WhatsApp y Email ✓");
  }else if(canal==="whatsapp"){
    toast("Pedido enviado por WhatsApp ✓");
  }else{
    toast("Pedido enviado por Email ✓");
  }

  /*
   * SOLO AHORA limpiamos el carrito.
   * El pedido ya ha sido preparado por todos los canales
   * disponibles y registrado una sola vez.
   */

  limpiarPedidoTrasEnvioV21();
}
function limpiarPedidoTrasEnvioV21(){
  const providerId=current?.id?String(current.id):"";

  /*
   * El pedido ya ha pasado a WhatsApp/Email.
   * Eliminamos SOLO el borrador del proveedor que acaba de enviarse.
   * Los borradores de todos los demás proveedores permanecen intactos.
   */
  try{
    if(providerId && typeof window.borrarBorradorProveedorV22==="function"){
      window.borrarBorradorProveedorV22(providerId);
    }
  }catch(e){
    console.warn("No se pudo borrar el borrador enviado",e);
  }

  /*
   * Vaciar el carrito visible de la Web App.
   */
  cart={};
  cartProviderId=providerId;
  updateCart();

  window.pedidoOrigenActualV21="";

  /*
   * Compatibilidad con el mecanismo legado V20.
   * También borra únicamente el proveedor actual.
   */
  try{
    if(typeof window.borrarBorradorPedidoV20==="function"){
      window.borrarBorradorPedidoV20();
    }
  }catch(e){}

  closeModal();

  /*
   * Refrescamos únicamente la vista principal para que el ✓ aparezca
   * inmediatamente. La fuente de verdad sigue siendo Sheets.
   */
  try{
    if(typeof renderHome==="function" && v44SentTodayProviders.has(providerId)){
      renderHome(homeFilter);
    }
  }catch(e){
    console.warn("No se pudo refrescar la vista tras enviar el pedido",e);
  }

  /*
   * Dejamos la pantalla en cero para el proveedor enviado.
   * Los demás proveedores siguen conservando sus borradores.
   */

  refreshAfterActionV21();
}


/* ============================================================
   V43 — CIERRE DEL DÍA
   - Consulta el historial centralizado del hotel/usuario actual.
   - Filtra únicamente los pedidos enviados HOY.
   - Incluye proveedor, canal, artículos, cantidades y formatos.
   - El botón prepara un correo mediante mailto.
   - El destinatario queda guardado localmente para no pedirlo
     cada día.
   ============================================================ */

function v43FechaLocalKey(fecha){
  const d=fecha instanceof Date?fecha:new Date(fecha);
  if(Number.isNaN(d.getTime()))return "";
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function v43HoyKey(){
  return v43FechaLocalKey(new Date());
}

function v43PedidosDeHoy(pedidos){
  const hoy=v43HoyKey();
  return (Array.isArray(pedidos)?pedidos:[])
    .filter(p=>v43FechaLocalKey(p.fecha)===hoy)
    .sort((a,b)=>new Date(a.fecha||0)-new Date(b.fecha||0));
}

function v43TotalUnidades(pedidos){
  return (Array.isArray(pedidos)?pedidos:[]).reduce((total,p)=>{
    const lineas=Array.isArray(p.lineas)?p.lineas:[];
    return total+lineas.reduce((s,l)=>s+(Number(l.cantidad)||0),0);
  },0);
}

function v43ConstruirResumenTexto(pedidos){
  const fecha=new Date().toLocaleDateString("es-ES",{
    weekday:"long",day:"numeric",month:"long",year:"numeric"
  });

  const partes=[];
  partes.push(`CIERRE DEL DÍA — ${fecha}`);
  partes.push(`Hotel: ${session.hotelNombre||""}`);
  partes.push(`Usuario: ${session.nombre||session.usuario||""}`);
  partes.push("");

  if(!pedidos.length){
    partes.push("No hay pedidos enviados hoy.");
    return partes.join("\n");
  }

  partes.push(`PEDIDOS REALIZADOS: ${pedidos.length}`);
  partes.push(`TOTAL UNIDADES: ${v43TotalUnidades(pedidos)}`);
  partes.push("");

  pedidos.forEach((pedido,index)=>{
    const canal=String(pedido.canal||"").toLowerCase()==="whatsapp"
      ?"WhatsApp":"Email";
    const hora=pedido.fecha
      ?new Date(pedido.fecha).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})
      :"";
    partes.push(`PROVEEDOR ${index+1}: ${pedido.proveedor_nombre||"Proveedor"}`);
    partes.push(`Canal: ${canal}${hora?" · Hora: "+hora:""}`);

    const lineas=Array.isArray(pedido.lineas)?pedido.lineas:[];
    lineas.forEach(linea=>{
      const cantidad=Number(linea.cantidad)||0;
      const nombre=linea.articulo_nombre||"Artículo";
      const formato=String(linea.formato||"").trim();
      partes.push(`${cantidad} × ${nombre}${formato?" — Formato: "+formato:""}`);
    });

    partes.push("");
  });

  return partes.join("\n").trim();
}

function v43ConstruirResumenHtml(pedidos){
  if(!pedidos.length){
    return `<div class="empty">No hay pedidos enviados hoy.</div>`;
  }

  return pedidos.map((pedido,index)=>{
    const canal=String(pedido.canal||"").toLowerCase()==="whatsapp"
      ?"WhatsApp":"Email";
    const hora=pedido.fecha
      ?new Date(pedido.fecha).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})
      :"";
    const lineas=Array.isArray(pedido.lineas)?pedido.lineas:[];
    const total=lineas.reduce((s,l)=>s+(Number(l.cantidad)||0),0);

    return `<div class="dayCloseSummaryV43">
      <div class="dayCloseSummaryHeadV43">
        <div class="dayCloseSummaryProviderV43">${index+1}. ${esc(pedido.proveedor_nombre||"Proveedor")}</div>
        <div class="dayCloseSummaryMetaV43">${esc(canal)}${hora?" · "+esc(hora):""} · ${total} uds.</div>
      </div>
      ${lineas.map(l=>`
        <div class="dayCloseSummaryLineV43">
          <strong>${Number(l.cantidad)||0}</strong>
          <span>${esc(l.articulo_nombre||"Artículo")}${l.formato?`<small style="display:block;color:#718096;margin-top:2px">Formato: ${esc(l.formato)}</small>`:""}</span>
        </div>
      `).join("")}
    </div>`;
  }).join("");
}

async function refreshAfterActionV21(options = {}){

  const currentProviderId=
    current?.id
      ? String(current.id)
      : "";

  const currentFilter=
    String(
      productFilter||""
    );

  const homeFilterSaved=
    String(
      homeFilter||""
    );

  /*
   * PRIMERO: respuesta visual inmediata.
   * No esperamos a Google Sheets para actualizar la pantalla.
   */
  try{

    if(
      currentProviderId &&
      providersById.has(currentProviderId)
    ){

      renderProviderArticles(
        currentFilter
      );

      updateCart();

    }else{

      renderHome(
        homeFilterSaved
      );

    }

  }catch(e){

    console.warn(
      "No se pudo refrescar inmediatamente la interfaz:",
      e
    );

  }

  /*
   * SEGUNDO: sincronización real en segundo plano.
   */
  try{

    await cargarDatos();

    await v44CargarPedidosRealizadosHoy();

    if(
      currentProviderId &&
      providersById.has(currentProviderId)
    ){

      openProvider(
        currentProviderId,
        currentFilter
      );

    }else{

      renderHome(
        homeFilterSaved
      );

    }

  }catch(error){

    console.error(
      "Error actualizando datos después de la acción:",
      error
    );

    /*
     * No hacemos location.reload().
     * La interfaz que ya estaba funcionando se mantiene.
     */
    try{

      if(
        currentProviderId &&
        providersById.has(currentProviderId)
      ){

        renderProviderArticles(
          currentFilter
        );

        updateCart();

      }else{

        renderHome(
          homeFilterSaved
        );

      }

    }catch(e){}

  }

}

function repetirPedidoV21(pedido){
  if(!pedido || !Array.isArray(pedido.lineas) || !pedido.lineas.length){
    toast("Este pedido no tiene líneas recuperables");
    return;
  }

  const provider=providers.find(p=>String(p.id)===String(pedido.proveedor_id));
  if(!provider){
    toast("El proveedor de este pedido ya no está disponible en este hotel");
    return;
  }

  current=provider;
  productFilter="";
  window.pedidoOrigenActualV21=String(pedido.id||"");

  /*
   * Recuperación robusta:
   * 1. ID del artículo.
   * 2. Código del artículo, si está disponible.
   * 3. Nombre normalizado como último respaldo.
   */
  const restored={};
  const faltantes=[];
  const usadosCartIds=new Set();

  const normalizarClave=valor =>
    String(valor||"")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"");

  const buscarArticuloHistorico=linea => {

    const lineaId=String(
      linea.articulo_id ??
      linea.ARTICULO_ID ??
      ""
    ).trim();

    if(lineaId){

      const byId=articles.find(a=>{
        const aid=String(a.idOriginal||"").trim();
        const cid=String(a.cartId||"").trim();
        return aid===lineaId || cid===lineaId;
      });

      if(byId) return byId;
    }

    const lineaCodigo=String(
      linea.articulo_codigo ??
      linea.codigo ??
      linea.CODIGO ??
      ""
    ).trim();

    if(lineaCodigo){

      const byCode=articles.find(a=>
        String(a.codigo||"").trim()===lineaCodigo &&
        String(a.providerId)===String(provider.id)
      );

      if(byCode) return byCode;
    }

    const lineaNombre=normalizarClave(
      linea.articulo_nombre ??
      linea.nombre ??
      linea.ARTICULO_NOMBRE ??
      ""
    );

    if(lineaNombre){

      const candidatos=articles.filter(a=>
        String(a.providerId)===String(provider.id) &&
        normalizarClave(a.name)===lineaNombre
      );

      if(candidatos.length===1) return candidatos[0];

      const libre=candidatos.find(a=>
        !usadosCartIds.has(String(a.cartId))
      );

      if(libre) return libre;
    }

    return null;
  };

  pedido.lineas.forEach(linea=>{

    const article=buscarArticuloHistorico(linea);

    const cantidad=
      Number(
        linea.cantidad ??
        linea.CANTIDAD ??
        0
      ) || 0;

    if(article && cantidad>0){

      const key=String(article.cartId);

      restored[key]=
        (restored[key]||0)+cantidad;

      usadosCartIds.add(key);

    }else{

      faltantes.push(
        linea.articulo_nombre ||
        linea.nombre ||
        "Artículo"
      );

    }

  });

  if(!Object.keys(restored).length){

    toast(
      "No se pudieron asociar los artículos de este pedido con los artículos actuales"
    );

    return;
  }

  closeModal();

  /*
   * Abrimos el proveedor para construir su pantalla.
   * El pedido histórico tendrá prioridad sobre cualquier borrador.
   */
  openProvider(
    current.id,
    ""
  );

  cart={
    ...restored
  };

  cartProviderId=
    String(current.id);

  window.pedidoOrigenActualV21=
    String(pedido.id||"");

  /*
   * Pintamos otra vez DESPUÉS de restaurar cart.
   */
  renderProviderArticles(
    productFilter
  );

  updateCart();

  /*
   * Guardamos el pedido recuperado como borrador editable.
   * Esto NO modifica el pedido original.
   */
  try{

    if(
      typeof window.guardarBorradorPedidoV22==="function"
    ){

      window.guardarBorradorPedidoV22();

    }

  }catch(e){

    console.warn(
      "No se pudo guardar el pedido recuperado como borrador",
      e
    );

  }

  if(faltantes.length){

    setTimeout(()=>{

      toast(
        "Pedido recuperado. Se omitieron artículos que ya no están activos: "+
        faltantes.join(", ")
      );

    },250);

  }else{

    setTimeout(()=>{

      toast(
        "Pedido recuperado. Puedes modificarlo antes de enviarlo."
      );

    },250);

  }
}

    // Actualizamos la memoria local sin volver a descargar toda la base.

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return esc(s).replace(/`/g,"&#96;")}

<script>
/* V38 — visible pending orders, using the existing V22 provider-separated drafts */
function v38DraftStoreKey(){
  const hotel=String(session?.hotelId||"SIN-HOTEL");
  const usuario=String(session?.usuario||session?.usuarioId||"SIN-USUARIO");
  return "ECONOMATO_BORRADORES_V22_"+hotel+"_"+usuario;
}
function v38ReadDrafts(){
  try{
    const d=JSON.parse(localStorage.getItem(v38DraftStoreKey())||"{}");
    return d&&typeof d==="object"&&!Array.isArray(d)?d:{};
  }catch(e){return {};}
}
function v38GetDraft(providerId){
  const d=v38ReadDrafts()[String(providerId)];
  if(!d||!d.cart||typeof d.cart!=="object"||!Object.keys(d.cart).length)return null;
  return d;
}
function v38DraftUnits(d){
  return Object.values(d?.cart||{}).reduce((s,n)=>s+Number(n||0),0);
}
function v38PendingCount(){
  return Object.values(v38ReadDrafts()).filter(d=>d&&d.cart&&Object.keys(d.cart).length).length;
}
function v38PendingHtml(){
  const entries=Object.values(v38ReadDrafts())
    .filter(d=>d&&d.cart&&Object.keys(d.cart).length)
    .sort((a,b)=>String(b.savedAt||"").localeCompare(String(a.savedAt||"")));
  if(!entries.length)return "";
  return `<div class="pendingHomeV38">
    <div class="pendingHomeV38Head">
      <div class="pendingHomeV38Title">🟡 Pedidos pendientes</div>
      <span class="pendingHomeV38Count">${entries.length}</span>
    </div>
    ${entries.map(d=>{
      const pid=escAttr(d.providerId);
      return `<div class="pendingHomeV38Row">
        <div class="pendingHomeV38Info">
          <div class="pendingHomeV38Provider">${esc(d.providerName||"Proveedor")}</div>
          <div class="pendingHomeV38Meta">${v38DraftUnits(d)} uds. · pendiente de finalizar</div>
        </div>
        <div class="pendingHomeV38Actions">
          <button type="button" class="pendingHomeV38Continue" onclick="verBorradorProveedorV22('${pid}')">Continuar</button>
          <button type="button" class="pendingHomeV38Delete" onclick="v38DeletePending('${pid}')">×</button>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}
function v38DeletePending(providerId){
  if(!confirm("¿Eliminar este pedido pendiente?"))return;
  try{
    if(typeof window.borrarBorradorProveedorV22==="function"){
      window.borrarBorradorProveedorV22(providerId);
    }else{
      const d=v38ReadDrafts();delete d[String(providerId)];
      localStorage.setItem(v38DraftStoreKey(),JSON.stringify(d));
    }
  }catch(e){}
  renderHome(homeFilter||"");
}
function v38PendingBadgeForProvider(providerId){
  const d=v38GetDraft(providerId);
  if(!d)return "";
  return `<div class="pendingBadgeV38">🟡 PEDIDO PENDIENTE · ${v38DraftUnits(d)} uds.</div>`;
}
</script>
<script>
(function(){
  /* ============================================================
     BORRADORES V22 — UNO POR PROVEEDOR
     - Solo guarda pedidos NO enviados.
     - Se separan por HOTEL + USUARIO + PROVEEDOR.
     - No entran en PEDIDOS ni en Historial hasta enviar.
     - Se recuperan desde el propio proveedor mediante "Ver pedido".
     ============================================================ */

  function draftStoreKey(){
    const hotel=String(session?.hotelId||"SIN-HOTEL");
    const usuario=String(session?.usuario||session?.usuarioId||"SIN-USUARIO");
    return "ECONOMATO_BORRADORES_V22_"+hotel+"_"+usuario;
  }

  function readStore(){
    try{return JSON.parse(localStorage.getItem(draftStoreKey())||"{}")}catch(e){return {}}
  }

  function writeStore(store){
    try{localStorage.setItem(draftStoreKey(),JSON.stringify(store))}catch(e){console.warn("No se pudieron guardar los borradores",e)}
  }

  function saveDraftForProvider(providerId){
    try{
      if(!providerId || !session) return;
      const ids=Object.keys(cart||{});
      const store=readStore();

      if(!ids.length){
        delete store[String(providerId)];
        writeStore(store);
        return;
      }

      store[String(providerId)]={
        version:22,
        savedAt:new Date().toISOString(),
        hotelId:session.hotelId||"",
        hotelNombre:session.hotelNombre||"",
        usuarioId:session.usuarioId||"",
        usuario:session.usuario||"",
        providerId:String(providerId),
        providerName:current?.name||"",
        pedidoOrigenId:window.pedidoOrigenActualV21||"",
        cart:{...cart}
      };
      writeStore(store);
      try{ if(typeof renderHome==="function" && !current) renderHome(homeFilter||""); }catch(e){}
    }catch(e){console.warn("No se pudo guardar el borrador",e)}
  }

  function getDraft(providerId){
    try{
      const d=readStore()[String(providerId)]||null;
      if(!d) return null;

      if(d.hotelId && session?.hotelId && String(d.hotelId)!==String(session.hotelId)) return null;
      if(d.usuario && session?.usuario && String(d.usuario)!==String(session.usuario)) return null;

      const age=Date.now()-new Date(d.savedAt).getTime();
      if(!Number.isFinite(age)||age>7*24*60*60*1000){
        deleteStore(providerId);
        return null;
      }
      return d;
    }catch(e){return null}
  }

  function deleteStore(providerId){
    const store=readStore();
    delete store[String(providerId)];
    writeStore(store);
  }

  function saveCurrent(){
    if(current?.id) saveDraftForProvider(current.id);
  }

  function clearAllDrafts(){
    try{localStorage.removeItem(draftStoreKey())}catch(e){}
  }

  function openDraft(providerId){
    const d=getDraft(providerId);
    if(!d){toast("No hay ningún borrador para este proveedor");return}

    const provider=providers.find(p=>String(p.id)===String(providerId));
    if(!provider){toast("El proveedor ya no está disponible");return}

    current=provider;
    cartProviderId=String(provider.id);
    cart={...(d.cart||{})};
    window.pedidoOrigenActualV21=d.pedidoOrigenId||"";
    openProvider(provider.id,"");
    setTimeout(()=>toast("Borrador recuperado. Puedes continuar el pedido."),150);
  }

  window.guardarBorradorPedidoV22=saveCurrent;
  window.obtenerBorradorProveedorV22=getDraft;
  window.borrarBorradorProveedorV22=deleteStore;
  window.verBorradorProveedorV22=openDraft;
  window.borrarTodosLosBorradoresV22=clearAllDrafts;

  // Compatibilidad con las llamadas V21 que ya existen.
  window.guardarBorradorPedidoV20=saveCurrent;
  window.borrarBorradorPedidoV20=function(){
    if(current?.id) deleteStore(current.id);
  };
  window.obtenerBorradorPedidoV20=function(){
    return current?.id ? getDraft(current.id) : null;
  };

  setInterval(saveCurrent,3000);
  window.addEventListener("beforeunload",saveCurrent);
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden") saveCurrent();
  });

  // No recuperamos automáticamente un pedido al entrar.
  // El usuario lo recupera desde el proveedor mediante "Ver pedido".
})();
</script>
